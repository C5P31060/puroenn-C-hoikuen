<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リアルタイムお迎え動向共有システム｜プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --o:#F2913F;            /* メインのオレンジ */
  --o-d:#E4762A;
  --o-l:#FDEBDD;          /* 淡いオレンジ面 */
  --o-l2:#FEF5EE;
  --side:#FFF9F4;         /* サイドバー */
  --peach:#FDF4EF;        /* 画面背景 */
  --card:#FFFFFF;
  --ink:#3D332C;
  --ink-2:#9A8C81;
  --line:#F1E8E1;
  --pink:#F2A7BC;
  --pri-bg:#FBE4DE; --pri-tx:#D9755C;   /* 優先順位 */
  --ok-bg:#E4F4E9;  --ok-tx:#3E9A62;    /* 承認済み・未到着 */
  --am-bg:#FDF0D9;  --am-tx:#D2941A;    /* まもなく */
  --rd-bg:#FCE6E2;  --rd-tx:#DB5A45;    /* 遅延 */
  --mint:#B4E3CC;   --mint-tx:#2E8B5F;
  --memo-bg:#FFFAEC; --memo-bd:#F0D9A8;
  --disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#EDE4DC;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:40px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:3px solid #F2B77E;outline-offset:2px;border-radius:6px}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== プロトタイプ操作バー（アプリの外側） ===== */
.harness{position:sticky;top:0;z-index:60;background:#3A2E27;color:#E3D6CB;border-bottom:2px solid var(--o)}
.harness-in{max-width:1200px;margin:0 auto;padding:9px 16px;display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center}
.harness .brand{font-family:var(--disp);font-weight:700;color:#fff;font-size:14px}
.harness .brand span{color:#F2B77E;font-size:11px;font-family:var(--mono);margin-left:8px;letter-spacing:.08em}
.hgroup{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.hctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.htoggle{display:none}
body.hb-off .harness{display:none}
#hshow{display:none;position:fixed;left:0;bottom:0;width:34px;height:34px;z-index:95;background:transparent}
body.hb-off #hshow{display:block}
body.hb-off #hshow:active{background:rgba(242,145,63,.25)}
.hbtn{font-size:12px;padding:5px 11px;border-radius:999px;background:#503F35;color:#E9DCD1;border:1px solid #6A5648}
.hbtn:hover{background:#63503f}
.hbtn.on{background:var(--o);color:#fff;border-color:var(--o)}
.hnow{font-family:var(--mono);font-size:12px;color:#C7A98F}
.hid{font-family:var(--mono);font-size:11px;color:#3A2E27;background:#F2C79A;padding:3px 8px;border-radius:5px;font-weight:600}

/* ===== 端末フレーム ===== */
.stage{max-width:1200px;margin:22px auto;padding:0 16px;display:flex;justify-content:center}
.phone{width:392px;max-width:100%;border-radius:38px;border:9px solid #221B16;box-shadow:0 26px 60px rgba(60,40,25,.3);overflow:hidden;display:flex;flex-direction:column;height:800px;
       background:linear-gradient(180deg,#FFF7F0 0%,#FDEDE1 58%,#FCE7D8 100%)}
.tablet{width:100%;max-width:1080px;border-radius:22px;border:9px solid #221B16;box-shadow:0 26px 60px rgba(60,40,25,.3);overflow:hidden;display:flex;flex-direction:column;height:740px;background:var(--peach)}
.statusbar{display:flex;justify-content:space-between;font-size:12px;padding:9px 20px 3px;color:#6A5D53;font-family:var(--disp);font-weight:700}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.roll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.roll::-webkit-scrollbar{width:7px}
.roll::-webkit-scrollbar-thumb{background:#E3D2C4;border-radius:4px}

/* ===== 共通 ===== */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;font-family:var(--disp);white-space:nowrap}
.pill.green{background:var(--ok-bg);color:var(--ok-tx)}
.pill.amber{background:var(--am-bg);color:var(--am-tx)}
.pill.red{background:var(--rd-bg);color:var(--rd-tx)}
.pill.gray{background:#F0EBE6;color:#96887C}
.pill.pri{background:var(--pri-bg);color:var(--pri-tx)}
.pill.orange{background:var(--o-l);color:var(--o-d)}
.muted{color:var(--ink-2)}
.tiny{font-size:11.5px}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 3px rgba(120,90,60,.07)}
.note{background:var(--o-l2);border-radius:14px;padding:14px 16px;font-size:12.5px;color:#8A7365;line-height:1.75;display:flex;gap:10px}
.memo-row{background:var(--memo-bg);border:1px solid var(--memo-bd);border-radius:10px}
.err{background:var(--rd-bg);border:1px solid #F2C4BB;color:#B4402C;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#3A2E27;color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.28);font-family:var(--disp);font-weight:700;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}}
.fieldl{display:block;font-size:12.5px;font-weight:700;margin:15px 0 6px;color:#7A6B60;font-family:var(--disp)}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:#fff}
.inp:focus{border-color:#F2C08A}
.sec{font-family:var(--disp);font-weight:700;font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:0}

/* ===== タブレット：サイドバー ===== */
.t-wrap{display:flex;height:100%;min-height:0}
.side{width:214px;flex:none;background:var(--side);border-right:1px solid #F3E7DD;display:flex;flex-direction:column}
.side .logo{background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:700;font-size:17px}
.side .items{padding:12px 10px;overflow-y:auto;flex:1}
.side .items::-webkit-scrollbar{width:0}
.sidebtn{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:13px;font-family:var(--disp);font-weight:700;font-size:14px;color:#7C6A5D;text-align:left;margin-bottom:3px}
.sidebtn svg{color:#C99C6E}
.sidebtn:hover{background:#FDEEE2}
.sidebtn.on{background:var(--o-l);color:var(--o-d)}
.sidebtn.on svg{color:var(--o)}
.sidebtn[disabled]{opacity:.5;cursor:default}
.side .me{border-top:1px solid #F3E7DD;padding:11px 13px;display:flex;gap:10px;align-items:center;background:#FFF4EC}
.side .me b{font-family:var(--disp);font-size:13px;display:block}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--peach)}

/* ===== タブレット：ヘッダー ===== */
.thead{background:var(--peach);padding:18px 26px 10px;display:flex;align-items:flex-start;gap:12px}
.thead h2{margin:0;font-family:var(--disp);font-weight:700;font-size:23px;display:flex;align-items:center;gap:11px}
.thead .sub{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.thead .right{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hpill{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);color:#8A7A6D;font-size:13px;font-family:var(--disp);font-weight:700;padding:9px 16px;border-radius:999px}
.hpill:hover{background:#FFF8F3}
.hpill.solid{background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;border:none;box-shadow:0 3px 8px rgba(240,140,59,.32)}
.tbody{flex:1;overflow-y:auto;padding:8px 26px 26px}
.tbody::-webkit-scrollbar{width:7px}
.tbody::-webkit-scrollbar-thumb{background:#E3D2C4;border-radius:4px}
.tabs{display:flex;gap:9px;padding:0 26px 12px;flex-wrap:wrap;align-items:center}
.tab{flex:none;white-space:nowrap;font-size:13px;font-family:var(--disp);font-weight:700;padding:8px 16px;border-radius:999px;background:#fff;color:#9A8C81;border:1px solid var(--line)}
.tab.on{background:var(--o);color:#fff;border-color:var(--o)}

/* タブレット下部ナビ */
.tnav{background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-around;padding:7px 0 9px;position:relative}
.tnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-family:var(--disp);font-weight:700;color:#B2A499;flex:1}
.tnav button.on{color:var(--o)}
.tnav .fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 5px 14px rgba(240,140,59,.4)}
.tnav .fabwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--o);font-family:var(--disp);font-weight:700}
.badge{position:absolute;top:-4px;right:-9px;background:#EE5A48;color:#fff;font-size:9.5px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;padding:0 4px}

/* ===== 代理人リスト（画像1） ===== */
.pxcard{background:#fff;border-radius:18px;padding:20px;display:flex;gap:20px;align-items:flex-start;margin-bottom:16px;box-shadow:0 1px 3px rgba(120,90,60,.07);width:100%;text-align:left}
.pxcard:hover{box-shadow:0 4px 14px rgba(120,90,60,.13)}
.pxphoto{width:132px;height:150px;border-radius:12px;overflow:hidden;flex:none;background:#EFEBE7}
.pxinfo{flex:1;min-width:0}
.pxtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pxname{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.01em}
.pxname small{font-size:15px;color:#7E7168;font-weight:500;margin-left:6px}
.dl{margin-top:10px}
.dl .row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid #F4EEE9;font-size:14px}
.dl .row:last-child{border-bottom:none}
.dl .row .lb{color:#8B7E74;width:96px;flex:none;font-size:13.5px}
.dl .row svg{color:#BCADA1;flex:none}
.dl .row.memo{background:var(--memo-bg);border:1px solid var(--memo-bd);border-radius:10px;padding:9px 12px;margin:4px 0}
.dl .row.memo svg{color:#D6A94E}
.dl .row.memo b{font-weight:700}
.chev{align-self:center;color:#C9BAAE;flex:none}

/* ===== 職員タイムライン（画像2） ===== */
.composer{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.compbox{flex:1;background:#fff;border-radius:16px;border:1px solid var(--line);padding:8px 8px 8px 20px;display:flex;align-items:center;gap:10px}
.compbox input{flex:1;border:none;outline:none;font-size:15px;background:transparent}
.compbox input::placeholder{color:#BEB1A6}
.daysep{display:flex;justify-content:center;margin:6px 0 20px}
.daysep span{background:#fff;border-radius:999px;padding:9px 26px;font-family:var(--disp);font-weight:700;font-size:14px;color:#7A6B60;box-shadow:0 1px 3px rgba(120,90,60,.08)}
.post{display:flex;gap:16px;position:relative;padding-bottom:16px}
.post:not(:last-child):before{content:"";position:absolute;left:26px;top:56px;bottom:0;width:2px;background:#EFE4DA}
.post .bub{background:#fff;border-radius:18px;padding:16px 20px;flex:1;box-shadow:0 1px 3px rgba(120,90,60,.07);min-width:0}
.post .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .who b{font-family:var(--disp);font-size:15px;color:var(--pink)}
.post .who .t{font-size:13px;color:#A79A8F;font-family:var(--mono)}
.post .who .more{margin-left:auto;color:#C4B6AA}
.post.teacher .who b{color:var(--o)}
.post.sys .who b{color:#5EA8C9}
.post .txt{font-size:15px;line-height:1.75}
.reacts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12.5px;color:#8B7E74;background:#fff}
.react.on{background:var(--ok-bg);border-color:#C6E6D2;color:var(--ok-tx)}
.post.imp .bub{border:2px solid #F3C089;background:#FFFBF6}
.post.alert .bub{border:2px solid #F2B3A6;background:#FFF8F6}
.post.compact{padding-bottom:8px}.post.compact .bub{padding:10px 14px;box-shadow:none;border:1px solid var(--line)}.post.compact .txt{font-size:13px}
.post.compact:before{display:none}
.autobox{background:#F6F1EC;border-radius:16px;padding:10px 12px;margin-bottom:16px}
.autohead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;color:#7A6B60}
.autohead span b{font-family:var(--disp);font-size:14px;display:block;color:var(--ink)}
.autohead span small{font-size:11.5px;color:var(--ink-2)}
.nb{margin-left:auto;background:#EE5A48;color:#fff;font-size:10.5px;min-width:19px;height:19px;border-radius:10px;display:inline-grid;place-items:center;padding:0 5px;font-family:var(--disp)}
.dbox{background:#FBF7F3;border-radius:12px;padding:10px 12px;margin-top:9px}
.dbox.nursery{background:var(--o-l2)}
.dhead{font-family:var(--disp);font-weight:700;font-size:12.5px;color:var(--o-d);margin-bottom:5px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px}
.drow{display:flex;gap:8px;font-size:12.5px}.drow span{color:var(--ink-2);min-width:34px}.drow b{font-weight:500}
.dtxt{font-size:13px;line-height:1.75;margin-top:6px;white-space:pre-wrap}
.dform{display:grid;grid-template-columns:auto 1fr;gap:9px 12px;align-items:center;margin-top:12px}
.dform>label{font-family:var(--disp);font-weight:700;font-size:12.5px;color:#7A6B60}
.drowin{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.drowin .inp{width:auto;min-width:0;padding:9px 10px}
@media(max-width:560px){.dgrid{grid-template-columns:1fr}}

/* ===== お帰りタイムライン ===== */
.ccard{display:flex;align-items:center;gap:15px;background:#fff;border-radius:16px;padding:14px 18px;width:100%;text-align:left;margin-bottom:11px;box-shadow:0 1px 3px rgba(120,90,60,.07);border-left:6px solid #DDD2C8}
.ccard:hover{box-shadow:0 4px 14px rgba(120,90,60,.13)}
.ccard.green{border-left-color:#5FBF8B}.ccard.amber{border-left-color:#EDB53F}
.ccard.red{border-left-color:#E8735C}.ccard.gray{border-left-color:#D8CDC4;opacity:.75}
.ccard.sel{outline:2.5px solid var(--o);opacity:1}
.ccard.orange{border-left-color:var(--o);background:#FFF9F3}
.count.orange .num b{color:var(--o-d)}
.arrsec{background:#FFF4EA;border:1px solid #F6DCC4;border-radius:18px;padding:14px 15px;margin-bottom:16px}
.arrsec .hd{font-family:var(--disp);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:11px;color:var(--o-d)}
.camwrap{position:relative;border-radius:18px;overflow:hidden;background:#241C17;aspect-ratio:4/3;display:grid;place-items:center}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.camwrap .guide{position:absolute;left:24%;right:24%;top:10%;bottom:14%;border:3px dashed rgba(255,255,255,.7);border-radius:50% 50% 46% 46%}
.camwrap .ph{color:#B9A896;font-size:13px;text-align:center;padding:24px;line-height:1.8}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid var(--o);margin:14px auto 0;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.shutter:active{transform:scale(.96)}
.qrguide{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:4px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.18)}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--o-l);border-top-color:var(--o);margin:0 auto;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.alertbig{background:#FFF6F4;border:2px solid #F2B3A6;border-radius:20px;padding:15px;display:flex;gap:15px;align-items:center;margin-bottom:12px}
.alertbig .big{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--rd-tx)}
@media(max-width:820px){.alertbig{flex-wrap:wrap}}
.kbar{background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:12px}
.kbar b{font-family:var(--disp);font-size:18px;display:block}
.kbar small{font-size:12px;opacity:.9}
.kbar .kclock{margin-left:auto;font-family:var(--disp);font-weight:900;font-size:30px;font-variant-numeric:tabular-nums}
.kfoot{display:flex;justify-content:flex-end;padding:6px 14px calc(8px + env(safe-area-inset-bottom))}
.kfoot button{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:#B8A99C;padding:6px 10px;border-radius:9px}
.kiosk{max-width:860px;margin:0 auto;text-align:center}
.kiosk h3{font-family:var(--disp);font-weight:900;font-size:26px;margin:4px 0 6px}
.kiosk .lead{font-size:15px;color:var(--ink-2);margin-bottom:18px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pickcard{background:#fff;border-radius:18px;padding:16px 12px;box-shadow:0 1px 3px rgba(120,90,60,.08);display:grid;justify-items:center;gap:8px}
.pickcard:hover{box-shadow:0 5px 16px rgba(120,90,60,.16)}
.pickcard b{font-family:var(--disp);font-size:16px}
.pickcard small{color:var(--ink-2);font-size:11.5px}
.arrbig{background:#fff;border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:12px;
        box-shadow:0 4px 18px rgba(228,118,42,.18);border:2px solid #F3C089;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 18px rgba(228,118,42,.18)}50%{box-shadow:0 4px 26px rgba(228,118,42,.34)}}
.arrbig .big{font-family:var(--disp);font-weight:900;font-size:22px;line-height:1.3}
.arrbig .room{font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--o-d);margin-top:3px}
.arrbig .ainfo{flex:1 1 230px;min-width:0}
.arrbig .aelap{text-align:center;min-width:96px}
.arrbig .elapse{font-size:24px!important;white-space:nowrap}
.arrbig .acts .btn{white-space:nowrap;justify-content:center}
.arrbig .elapse{font-family:var(--disp);font-weight:900;font-size:30px;color:var(--o-d);font-variant-numeric:tabular-nums}
.arrbig .thumbs{display:flex;gap:8px;align-items:center}
.arrbig .th{width:62px;height:72px;border-radius:12px;overflow:hidden;background:#EFEDEA;flex:none}
.arrbig .th img{width:100%;height:100%;object-fit:cover;display:block}
.arrbig .acts{margin-left:auto;display:grid;gap:8px;justify-items:stretch}
@media(max-width:820px){.arrbig{flex-wrap:wrap;gap:12px}.arrbig .ainfo{flex:1 1 calc(100% - 92px)}.arrbig .thumbs{flex:1}
  .arrbig .acts{margin-left:0;width:100%;grid-template-columns:repeat(3,1fr)}.arrbig .acts .btn{padding:10px 4px!important;font-size:12px;justify-content:center}
  .arrbig .acts .btn svg{display:none}}
.shotbox{border-radius:18px;overflow:hidden;aspect-ratio:1/1.05;background:#EFEDEA}
.shotbox img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .nm{font-family:var(--disp);font-weight:700;font-size:17px;margin-top:1px}
.ccard .meta{font-size:12px;color:var(--ink-2);margin-top:3px}
.count{margin-left:auto;text-align:right;min-width:118px}

/* なりすまし対策

   ② 首振り：毎回ランダムに左右どちらかを指示し、その通りに動くかを見る（録画した動画を防ぐ） */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

  const v=document.getElementById('camView');if(!v||!v.videoWidth)return null;

async function runLiveness(){
  const token=++liveToken;
  const alive=()=>token===liveToken&&state.camStep==='live';
  const fail=k=>{if(token!==liveToken)return;stopCam();state.camResult={kind:k};state.camStep='fail';render();};
  try{await withTimeout(loadFace(),20000);}catch(e){return fail('engine');}
  /* ① まばたき */
  /* 正面を向いた顔を少しのあいだ確かめる（首振りの基準にする） */
  let seen=false,t0=Date.now();const yawBuf=[];
  while(Date.now()-t0<9000&&yawBuf.length<8){
    if(!alive())return;
    const P=await liveFrame();
    if(P){seen=true;yawBuf.push(yawOf(P));}
    liveSay(seen?'カメラを見たまま、少しお待ちください':'枠の中に顔を入れてください');
    await sleep(80);
  }
  if(!seen)return fail('noface');
  /* ② ランダムな首振り（基準＝まばたき中に正面を見ていたときの向き。指示を見てすぐ動いても基準はずれない） */
  if(!yawBuf.length)return fail('noface');
  const y0=yawBuf.slice().sort((a,b)=>a-b).at(Math.floor(yawBuf.length/2));
  /* 左右を毎回ランダムに2回指示し、そのたびに正面へ戻す（録画では順番を合わせられない） */
  const dirs=[Math.random()<0.5?1:-1,Math.random()<0.5?1:-1];
  for(let n=0;n<dirs.length;n++){
    const dir=dirs.at(n);
    const no=['②','③','④','⑤'];
    liveSay(no.at(n*2)+(dir>0?' 顔をゆっくり左に向けてください':' 顔をゆっくり右に向けてください'));
    let ok=0,wrong=0,turned=false;t0=Date.now();
    while(Date.now()-t0<7000){
      if(!alive())return;
      const P=await liveFrame();
      if(P){const d=(yawOf(P)-y0)*dir;
        if(d>0.12){ok++;wrong=0;}else if(d<-0.12){wrong++;ok=0;}else{ok=0;wrong=0;}
        if(wrong>=3)return fail('live');
        if(ok>=2){turned=true;break;}}
      await sleep(70);
    }
    if(!turned)return fail('live');
    liveSay(no.at(n*2+1)+' 正面に戻してください');
    let back=false;t0=Date.now();
    while(Date.now()-t0<5000){
      if(!alive())return;
      const P=await liveFrame();
      if(P&&Math.abs(yawOf(P)-y0)<0.06){back=true;break;}
      await sleep(70);
    }
    if(!back)return fail('live');
  }
  /* 正面を向いたところで撮影 */
  await sleep(120);if(!alive())return;
  state.liveDone=true;state.shot=grabFrame();stopCam();verifyFace();
}

/* 撮影した顔と登録写真の顔を比べ、一致すれば受付完了・違えば認証失敗 */
async function verifyFace(){

  const p=proxiesOf(c.id).find(x=>x.id===state.camProxy)||proxiesOf(c.id)[0];
  const fail=(kind,extra)=>{state.camResult=Object.assign({kind},extra||{});state.camStep='fail';render();};
  state.camStep='checking';render();
  if(!pxValid(p))return fail('invalid');
  if(!p.src)return fail('nophoto');
  try{await withTimeout(loadFace(),25000);}catch(e){return fail('engine');}
  try{
    const d1=await withTimeout(descOf(state.shot),15000);
    if(!d1)return fail('noface');
    if(!p.desc)p.desc=descCache.get(p.src)||await withTimeout(descOf(p.src),15000);
    if(!p.desc)return fail('regface');
    descCache.set(p.src,p.desc);

    if(dist<(state.cam.thr||0.5)){state.camFails=0;checkIn(dist);}
    else{

function validateDataset(d){

/* ---- 決まった規則で作る乱数（同じ設定なら毎回同じ顔ぶれになる） ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(x){let h=2166136261;for(const ch of String(x)){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
/* "17:30" → 今日のその時刻 */
function todayAt(hhmm){const [h,m]=String(hhmm).split(':').map(Number);const d=new Date(Date.now());d.setHours(h||0,m||0,0,0);return d.getTime();}
/* データの器の1件を、アプリで使う形にする（offset＝今から何分後、pickup＝"17:30" のどちらでも書ける） */
function mkChild(o,n0){
  const at=o.pickup?todayAt(o.pickup):n0+(o.offset||0)*60000;
  const c=Object.assign({},o,{fam:o.fam||o.id,pickupAt:at,planAt:at,changed:o.changed||null,st:o.st||'waiting'});
  delete c.offset;delete c.pickup;
  if(c.st==='arrived'&&!c.arrivedAt){c.arrivedAt=at+60000;const parts=(c.by||'').split(' ');
    c.arrivedBy=parts.slice(1).join(' ')+'（'+parts[0]+'）';c.verified='px_'+c.id;}
  return c;
}
function mkProxy(p,F){const q=Object.assign({},p);
  if(q.period==='previous'){q.from=F.prevFrom;q.to=F.prevTo;}else if(!q.from||!q.to){q.from=F.from;q.to=F.to;}
  delete q.period;q.style=q.style||0;
  q.auth=q.auth||(q.photo?'写真を見て確認（登録済み）':'特徴メモで確認（事前登録）');return q;}
/* 1つの園のデータを作る：シナリオ（デモ用の家庭）＋ 明示されたデータ または 自動で作るダミー */
function genSchool(sid){
  const D=dataset(),sc=D.schools.find(x=>x.id===sid)||D.schools[0],F=fy(),n0=Date.now();
  const out={children:[],proxies:{},diary:{},posts:[],notices:[],stats:{app:0,phone:0,camOK:0,camNG:0}};
  (D.commonNotices||[]).forEach(n=>out.notices.push(Object.assign({},n,{t:n0-(n.minutesAgo||0)*60000})));
  const scen=D.scenario&&D.scenario.school===sc.id?D.scenario:null;
  if(scen){
    (scen.children||[]).forEach(o=>out.children.push(mkChild(o,n0)));
    Object.entries(scen.proxies||{}).forEach(([fk,l])=>out.proxies[fk]=l.map(x=>mkProxy(x,F)));
    (scen.posts||[]).forEach(x=>out.posts.push(Object.assign({},x,{t:n0-(x.minutesAgo||0)*60000})));
    Object.assign(out.diary,JSON.parse(JSON.stringify(scen.diary||{})));
    (scen.notices||[]).forEach(n=>out.notices.push(Object.assign({},n,{t:n0-(n.minutesAgo||0)*60000})));
    if(scen.stats)Object.assign(out.stats,scen.stats);
  }
  const ex=(D.schoolsData||{})[sc.id];
  if(ex){(ex.children||[]).forEach(o=>out.children.push(mkChild(o,n0)));
    Object.entries(ex.proxies||{}).forEach(([fk,l])=>out.proxies[fk]=l.map(x=>mkProxy(x,F)));}
  else genKids(sc,out,n0,F);
  out.notices.forEach(n=>delete n.minutesAgo);out.posts.forEach(x=>delete x.minutesAgo);
  out.posts.forEach(x=>{if(!Array.isArray(x.ackBy))x.ackBy=[];if(x.auto===undefined)x.auto=x.kind==='sys';delete x.ack;});
  /* 連絡帳：「今日」「昨日」を日付に。最初から入っている記録は既読として扱う（自分で書いた記録が埋もれないように） */
  const dk=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
  const dl=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日（'+'日月火水木金土'.charAt(d.getDay())+'）';};
  Object.entries(out.diary).forEach(([cid,l])=>l.forEach((e,i)=>{
    if(!e.id)e.id='d0_'+cid+'_'+i;
    if(!e.key&&(e.d==='今日'||e.d==='昨日')){const ts=n0-(e.d==='昨日'?86400000:0);e.key=dk(ts);e.d=dl(ts);}
    if(e.staffSeen===undefined)e.staffSeen=true;if(e.parentSeen===undefined)e.parentSeen=true;}));
  return out;
}
/* ダミーの園児・保護者を作る。名前は名字と名前の組み合わせで、実在の人物とは関係ない */
function genKids(sc,out,n0,F){
  const D=dataset(),G=D.generator,N=G.names,R=mulberry32(((G.seed||1)^hashStr(sc.id))>>>0);
  const pick=a=>a[Math.floor(R()*a.length)],between=(a,b)=>a+Math.floor(R()*(b-a+1));
  const win=G.pickupWindow||[-150,180];
  const taken=new Set(out.children.map(c=>c.name)),fams=[];let gi=0,qi=0;
  const tel=()=>'000-'+String(between(0,9999)).padStart(4,'0')+'-'+String(between(0,9999)).padStart(4,'0');
  D.classes.forEach((k,ci)=>{
    const size=between(k.size[0],k.size[1]);
    for(let i=0;i<size;i++){
      const id='g'+String(++gi).padStart(3,'0');
      const girl=R()<0.5;let given=pick(girl?N.girls:N.boys);
      let fam=null;
      if(R()<(G.siblingRate||0)){const cand=fams.filter(f=>f.kids===1&&f.ci!==ci);if(cand.length)fam=pick(cand);}
      /* 同じ園で同姓同名にならないよう、重なったら選び直す */
      if(fam){for(let t=0;t<40&&taken.has(fam.sur[0]+' '+given[0]);t++)given=pick(girl?N.girls:N.boys);
        if(taken.has(fam.sur[0]+' '+given[0]))fam=null;}
      if(!fam){
        let sur=pick(N.surnames);
        for(let t=0;t<60&&taken.has(sur[0]+' '+given[0]);t++){sur=pick(N.surnames);if(t%3===2)given=pick(girl?N.girls:N.boys);}
        const mom=R()<0.72,g=pick(mom?N.mothers:N.fathers);
        fam={key:'f'+String(fams.length+1).padStart(3,'0'),sur,rel:mom?'母':'父',g,kids:0,ci};fams.push(fam);
        const P=[{id:'q'+(++qi),name:sur[0]+' '+g[0],kana:sur[1]+' '+g[1],rel:fam.rel,tel:tel(),photo:0,memo:'',prio:1,ok:true}];
        if(R()<0.45){const g2=pick(mom?N.fathers:N.mothers);
          P.push({id:'q'+(++qi),name:sur[0]+' '+g2[0],kana:sur[1]+' '+g2[1],rel:mom?'父':'母',tel:tel(),photo:0,memo:'',prio:2,ok:true});}
        if(R()<0.35){const gm=R()<0.5,g3=pick(gm?N.grandmothers:N.grandfathers);
          P.push({id:'q'+(++qi),name:sur[0]+' '+g3[0],kana:sur[1]+' '+g3[1],rel:gm?'祖母':'祖父',tel:tel(),photo:0,memo:pick(N.features||['']),prio:P.length+1,ok:true});}
        out.proxies[fam.key]=P.map(x=>mkProxy(x,F));
      }
      fam.kids++;
      const name=fam.sur[0]+' '+given[0];taken.add(name);
      /* 今の時刻との差で状態を決める：だいぶ前に予定を過ぎた子はお迎え済み（一部は遅れ）、
         直前に過ぎた子は到着（引き渡し待ち）か遅れ、これからの子は未到着 */
      const off=Math.round(between(win[0],win[1])/5)*5;let st='waiting';
      if(off<-20)st=(off>-45&&R()<0.15)?'waiting':'released';
      else if(off<0&&R()<0.35)st='arrived';
      const c=mkChild({id,name,kana:fam.sur[1]+' '+given[1],sfx:girl?'ちゃん':'くん',cls:k.name,age:k.age,fam:fam.key,offset:off,
        by:fam.rel+' '+fam.sur[0]+' '+fam.g[0],st},n0);
      if(st==='waiting'){const r=R();
        if(r<(G.appChangeRate||0)){c.planAt=c.pickupAt-between(2,4)*5*60000;c.changed='保護者アプリ';out.stats.app++;}
        else if(r<(G.appChangeRate||0)+(G.phoneChangeRate||0)){c.planAt=c.pickupAt-between(2,4)*5*60000;c.changed='事務スタッフ 代理入力';out.stats.phone++;}}
      if(R()<(G.diaryRate||0))out.diary[id]=[{d:'今日',temp:(36.3+between(0,6)/10).toFixed(1),mood:pick(['良好','良好','ふつう','少し不調']),
        txt:pick(['朝ごはんをよく食べました。','少し鼻水が出ています。','昨夜は早く寝ました。','週末は家族で公園に行きました。']),reply:''}];
      out.children.push(c);
    }
  });
}

const staffName=()=>me().name+(me().cls?'（'+me().cls+'）':'（事務）');
function stat(c){
  if(c.st==='released')return{k:'released',label:'降園済み',tone:'gray'};
  if(c.st==='arrived') return{k:'arrived',label:'お迎えの方が到着',tone:'orange'};
  const m=(c.pickupAt-now())/60000;
  if(m<0)return{k:'late',label:'遅延中',tone:'red'};
  if(m<=state.thr.soon)return{k:'soon',label:'まもなく到着',tone:'amber'};
  return{k:'waiting',label:'未到着',tone:'green'};
}
function countText(c){
  const s=stat(c);
  if(s.k==='released')return{big:'降園済み',sub:'受け渡し完了',plain:1};
  if(s.k==='arrived') return{big:'引き渡し待ち',sub:hm(c.arrivedAt||c.pickupAt)+'に到着',plain:1};
  const d=(c.pickupAt-now())/60000;
  if(d<0)return{big:Math.max(1,Math.floor(-d)),sub:hm(c.pickupAt)+'を'+Math.max(1,Math.floor(-d))+'分過ぎています',pre:'あと'};
  return{big:Math.max(0,Math.ceil(d)),sub:hm(c.pickupAt)+'に到着予定',pre:'あと'};
}

}

/* ---- 連絡帳の部品 ---- */
const isYoung=c=>/^[012]歳/.test((c&&c.age)||'');
const nowHM=()=>{const d=new Date(now());return pad(d.getHours())+':'+pad(d.getMinutes());};
/* 体温：全角の数字や小数点（３６．８）も半角にそろえる */
const normTemp=t=>zen2han(t).replace(/[．。，､]/g,'.').replace(/\s/g,'');
const BM=['なし','ふつう','やわらかい','かたい','下痢'],EAT=['全部','ほとんど','半分','少し','食べていない'],MOOD=['良好','ふつう','少し不調'];
const opts=(arr,sel)=>arr.map(v=>`<option ${v===sel?'selected':''}>${v}</option>`).join('');
/* 以前の形（体温・機嫌・様子・返信だけ）の記録も、新しい形として読めるようにする */
function normEntry(e){if(!e)return null;
  const home=e.home!==undefined?e.home:((e.temp||e.mood||e.txt)?{temp:e.temp==='—'?'':e.temp,mood:e.mood==='—'?'':e.mood,txt:e.txt}:null);
  const nursery=e.nursery!==undefined?e.nursery:(e.reply?{txt:e.reply}:null);
  return Object.assign({},e,{home,nursery});}
function todayEntry(cid){const l=state.diary[cid]||[];return l[0]&&l[0].key===today()?l[0]:null;}
function sleepLen(a,b){if(!a||!b)return '';const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);
  let m=(h2*60+m2)-(h1*60+m1);if(m<=0)m+=1440;return Math.floor(m/60)+'時間'+(m%60?(m%60)+'分':'');}
const dRow=(label,val)=>val?`<div class="drow"><span>${label}</span><b>${val}</b></div>`:'';
const atTxt=(v,at)=>v?esc(v)+(at?'（'+esc(at)+'）':''):'';
function entryHTML(raw,isNew){const e=normEntry(raw),h=e.home,n=e.nursery;
  let out=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="font-family:var(--disp);font-size:14px">${esc(e.d||'')}</b>${isNew?`<span class="pill orange">${isNew}</span>`:''}</div>`;
  if(h)out+=`<div class="dbox"><div class="dhead">お家での様子</div><div class="dgrid">
      ${dRow('体温',h.temp?esc(h.temp)+'℃'+(h.tempAt?'（'+esc(h.tempAt)+'）':''):'')}
      ${dRow('睡眠',h.sleep||h.wake?esc(h.sleep||'？')+' → '+esc(h.wake||'？')+(h.sleep&&h.wake?'（'+sleepLen(h.sleep,h.wake)+'）':''):'')}
      ${dRow('排便',h.bm?atTxt(h.bm,h.bm!=='なし'&&h.bmAt):'')}
      ${dRow('朝食',atTxt(h.bf,h.bfAt))}${dRow('機嫌',h.mood?esc(h.mood):'')}</div>
      ${h.txt?`<div class="dtxt">${esc(h.txt)}</div>`:''}</div>`;
  if(n)out+=`<div class="dbox nursery"><div class="dhead">園での様子${e.repliedBy?'（'+esc(e.repliedBy)+'）':''}</div><div class="dgrid">
      ${dRow('午睡',n.napFrom||n.napTo?esc(n.napFrom||'？')+' → '+esc(n.napTo||'？')+(n.napFrom&&n.napTo?'（'+sleepLen(n.napFrom,n.napTo)+'）':''):'')}
      ${dRow('排便',n.bm?atTxt(n.bm,n.bm!=='なし'&&n.bmAt):'')}
      ${dRow('給食',n.lunch?esc(n.lunch):'')}${dRow('おやつ',n.snack?esc(n.snack):'')}
      ${dRow('体温',n.temp?esc(n.temp)+'℃'+(n.tempAt?'（'+esc(n.tempAt)+'）':''):'')}</div>
      ${n.txt?`<div class="dtxt">${esc(n.txt)}</div>`:''}</div>`;
  return out;}
/* 新しい記入・返信の印 */
const diaryNewCount=()=>state.children.filter(c=>(state.diary[c.id]||[]).some(e=>normEntry(e).home&&e.staffSeen===false)).length;
const parentNewReplies=()=>pfam().reduce((a,k)=>a+(state.diary[k.id]||[]).filter(e=>normEntry(e).nursery&&e.parentSeen===false).length,0);
function markParentSeen(){const ids=[];pfam().forEach(k=>(state.diary[k.id]||[]).forEach(e=>{if(normEntry(e).nursery&&e.parentSeen===false){ids.push(e.id);e.parentSeen=true;}}));

function markStaffSeen(cid){const ids=[];if(state.role!=='admin')(state.diary[cid]||[]).forEach(e=>{if(normEntry(e).home&&e.staffSeen===false){ids.push(e.id);e.staffSeen=true;}});state.newIds=ids;}

/* --- S10 お帰りタイムライン --- */
SCR.S10=()=>{
  const f=state.filter,all=state.children.slice().filter(c=>!state.s10cls||c.cls===state.s10cls);
  const classes=[...new Set(state.children.map(c=>c.cls))];
  const match=c=>{const k=stat(c).k;return f==='all'||(f==='yet'&&(k==='waiting'||k==='soon'))||(f==='arr'&&k==='arrived')||(f==='done'&&k==='released')||(f==='late'&&k==='late');};
  const arrived=all.filter(c=>c.st==='arrived').sort((a,b)=>(a.arrivedAt||a.pickupAt)-(b.arrivedAt||b.pickupAt)).filter(match);
  const waiting=all.filter(c=>c.st==='waiting').sort((a,b)=>a.pickupAt-b.pickupAt);
  const done=all.filter(c=>c.st==='released').sort((a,b)=>b.pickupAt-a.pickupAt);
  const past=waiting.filter(c=>c.pickupAt<now()).filter(match),future=waiting.filter(c=>c.pickupAt>=now()).filter(match),doneF=done.filter(match);
  const counts={all:all.length,arr:all.filter(c=>c.st==='arrived').length,yet:waiting.filter(c=>c.pickupAt>=now()).length,
                done:done.length,late:waiting.filter(c=>c.pickupAt<now()).length};
  const right=`<button class="hpill ${state.s10cls?'solid':''}" onclick="act('s10menu')">${ic('filter',18)}${state.s10cls?state.s10cls+'のみ':'クラスで絞り込み'}</button>
    <span class="pill green" style="padding:9px 13px">${ic('clock',14)}自動更新中</span>`;
  return thead('お帰りタイムライン','clock',md(now())+'（'+wd(now())+'）'+curSchool().name,right)
   +(state.s10menu?`<div class="tabs" style="padding-bottom:8px"><span class="tiny muted" style="align-self:center;margin-right:4px">クラス：</span>
       <button class="tab ${!state.s10cls?'on':''}" onclick="act('s10cls','')">すべてのクラス</button>
       ${classes.map(cl=>`<button class="tab ${state.s10cls===cl?'on':''}" onclick="act('s10cls','${cl}')">${cl}</button>`).join('')}</div>`:'')
   +`<div class="tabs">${[['all','すべて'],['arr','到着'],['yet','未到着'],['late','遅延'],['done','受け渡し済み']].map(([k,l])=>
       `<button class="tab ${f===k?'on':''}" onclick="act('filter','${k}')">${l}（${counts[k]}）</button>`).join('')}</div>
     <div class="tbody">
      ${state.alerts.length?state.alerts.map(alertRow).join(''):''}
      ${arrived.length?`<div class="arrsec"><div class="hd">${ic('check',19)}お迎えの方が到着しています（${arrived.length}名）</div>
        ${arrived.map(arrivedRow).join('')}</div>`:''}
      ${past.map(cardRow).join('')}
      ${(past.length&&future.length)?`<div class="nowbar">現在 ${hm(now())}</div>`:''}
      ${future.map(cardRow).join('')}
      ${doneF.length?`<div class="sec" style="color:var(--ink-2);font-size:13px">受け渡し済み</div>`+doneF.map(cardRow).join(''):''}
      ${(!arrived.length&&!past.length&&!future.length&&!doneF.length)?`<div class="card" style="padding:34px;text-align:center;color:var(--ink-2)">この条件に当てはまる園児はいません。</div>`:''}
     </div>`;
};

function postHTML(p,compact){
  const acks=ackList(p),mine=acks.includes(me().short),admin=state.role==='admin';
  const notYet=isStaffPost(p)?staffRoster().filter(x=>!acks.includes(x)):[];
  const color=p.alert?'#E8735C':p.kind==='clerk'?'#F2A7BC':p.kind==='sys'?'#8FC3E8':'#F5C842';
  return `<div class="post ${p.kind}${p.imp?' imp':''}${p.alert?' alert':''}${compact?' compact':''}">
    ${flower(color,compact?36:52)}
    <div class="bub"><div class="who"><b>${esc(p.who)}</b><span class="t">${hm(p.t)}</span>
      ${p.imp?'<span class="pill orange" style="margin-left:auto">重要</span>':''}${p.alert?'<span class="pill red" style="margin-left:'+(p.imp?'4px':'auto')+'">確認依頼</span>':''}</div>
      <div class="txt">${p.txt}</div>
      ${compact?'':`<div class="reacts">
        <button class="react ${mine?'on':''}" onclick="act('ack','${p.id}')">${ic('smile',17)}${mine?'了解済み':'了解しました'}</button>
        ${isStaffPost(p)&&!admin?`<button class="react ${p.imp?'on':''}" onclick="act('pin','${p.id}')">${ic('info',16)}${p.imp?'固定を外す':'重要にする'}</button>`:''}</div>
      ${acks.length||notYet.length?`<div class="tiny muted" style="margin-top:7px;line-height:1.7">
        ${acks.length?`<span style="color:var(--ok-tx)">了解：${acks.map(esc).join('・')}（${acks.length}名）</span>`:''}
        ${notYet.length?`${acks.length?'　':''}まだ：${notYet.map(esc).join('・')}`:''}</div>`:''}`}
    </div></div>`;
}
function tlListHTML(){
  const q=state.q||'',pf=state.pfilter;
  /* ふりがなで検索したときも、その園児の名前（漢字）を含む投稿を出す */
  const alias=norm(q)?state.children.filter(c=>norm(c.kana).includes(norm(q))).map(c=>norm(c.name)):[];
  const hit=p=>{if(!norm(q))return true;const t=norm(p.txt+p.who);return t.includes(norm(q))||alias.some(a=>t.includes(a));};
  const okPF=p=>pf==='all'||(pf==='staff'&&isStaffPost(p)&&!p.alert)||(pf==='imp'&&p.imp)||(pf==='alert'&&p.alert)||(pf==='auto'&&p.auto);
  const list=state.posts.filter(p=>okPF(p)&&hit(p));
  /* 検索・絞り込み中は、当てはまる投稿をそのまま並べる */
  if(norm(q)||pf!=='all')return `<div class="daysep"><span>今日　${list.length}件</span></div>`
    +(list.length?list.map(p=>postHTML(p)).join(''):`<div class="card" style="padding:30px;text-align:center;color:var(--ink-2)">該当する投稿はありません。</div>`);
  const pinned=list.filter(p=>p.imp).sort((a,b)=>b.t-a.t);
  const autos=list.filter(p=>p.auto&&!p.imp).sort((a,b)=>b.t-a.t);
  const main=list.filter(p=>!p.auto&&!p.imp);
  return `${pinned.length?`<div class="sec" style="font-size:13.5px;color:var(--o-d)">${ic('info',18)}重要（上に固定）</div>${pinned.map(p=>postHTML(p)).join('')}`:''}
    ${autos.length?`<div class="autobox">
      <button class="autohead" onclick="act('toggleAuto')">${ic('bell',18)}<span><b>自動のお知らせ ${autos.length}件</b>
        <small>受付・引き渡し・保護者アプリからの連絡など／最新：${hm(autos[0].t)} ${esc(autos[0].txt.replace(/<[^>]+>/g,'').slice(0,34))}…</small></span>
        <span class="pill gray" style="margin-left:auto">${state.showAuto?'たたむ':'ひらく'}</span></button>
      ${state.showAuto?`<div style="margin-top:10px">${autos.map(p=>postHTML(p,true)).join('')}</div>`:''}</div>`:''}
    <div class="daysep"><span>今日の職員の連絡</span></div>
    ${main.length?main.map(p=>postHTML(p)).join(''):`<div class="card" style="padding:24px;text-align:center;color:var(--ink-2);font-size:13px">職員の投稿はまだありません。</div>`}`;
}

function dListHTML(){
  const hasNew=c=>(state.diary[c.id]||[]).some(e=>normEntry(e).home&&e.staffSeen===false);
  const list=state.children.filter(c=>(state.dnew?hasNew(c):(!state.dcls||c.cls===state.dcls))&&hitChild(c,state.dq));
  if(!list.length)return `<div class="card" style="padding:24px;text-align:center;color:var(--ink-2);font-size:13px">${state.dnew?'新しい記入はありません。':'「'+esc(state.dq)+'」に当てはまる園児がいません。'}</div>`;
  return list.map(c=>{const e=normEntry((state.diary[c.id]||[])[0]),nw=hasNew(c);
    const label=nw?'新しい記入あり':e?(e.nursery?'返信済み':(e.home?'保護者の記入あり・未返信':'')):'記入なし';
    return `<button class="ccard ${nw?'orange':e?(e.nursery?'gray':'amber'):'green'} ${state.diaryChild===c.id?'sel':''}" style="margin-bottom:9px" onclick="act('pickDiary','${c.id}')">
      ${face(c,42)}
      <div style="min-width:0"><div class="tiny muted">${c.cls}</div><div class="nm">${c.name}${c.sfx}</div>
        <div class="meta">${nw?'<b style="color:var(--o-d)">'+label+'</b>':label}${e?'（'+esc(e.d||'')+'）':''}</div></div>
      <span class="chev" style="margin-left:auto">${ic('chev',18)}</span></button>`;}).join('');
}

    <div class="sec">確認の手順</div>

    <div class="card" style="padding:17px;margin-top:6px">

      <div style="display:flex;gap:11px;margin-top:15px;flex-wrap:wrap">
        <button class="btn ok" ${canPass?'':'disabled'} onclick="act('holdOk')">${ic('check',20)}保護者に確認が取れた｜引き渡しへ</button>
        <button class="btn ng" onclick="act('holdNg')">引き渡さずに記録する</button></div>
      <div class="tiny muted" style="margin-top:10px">対応した職員と時刻が記録に残ります。</div>

      <b style="margin:0">${esc(x.name)}</b><small>${esc(x.address||'')}</small>
      <small style="display:block;margin-top:3px">園児 ${x.id===state.schoolId?state.children.length:schoolSummary(x.id).kids}名${x.center?'・支援センター内':''}</small></button>`).join('')}</div>`).join('');

/* =========================================================
   受付カメラ（玄関のタブレット）
   ========================================================= */
SCR.S27=()=>{
  const step=state.camStep||'pick';
  const sel=child(state.camChild);
  const kioskRole=state.role==='kiosk';
  const back=`<div style="margin-top:16px"><button class="btn g" onclick="act('camReset')">最初の画面に戻る</button></div>`;

  if(step==='done'){
    const kids=(state.camDoneKids||[]).map(child).filter(Boolean);
    const list=kids.length?kids:[sel||state.children[0]];
    return `<div class="tbody"><div class="kiosk" style="padding-top:26px">
      <div style="width:104px;height:104px;border-radius:50%;background:#E4F4E9;display:grid;place-items:center;margin:0 auto">${ic('check',56,'#48A876')}</div>
      <h3 style="margin-top:18px">受付が完了しました</h3>
      <div class="lead">${state.err?'通信が切れているため、先生の画面にすぐには届きません。<br><b>先生に直接お声がけください。</b>':'先生にお知らせしました。保育室でお待ちください。'}</div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      ${list.map(c=>`<div class="card" style="padding:16px 18px;display:inline-flex;gap:14px;align-items:center;text-align:left">
        ${face(c,52)}<div><b style="font-family:var(--disp);font-size:18px">${c.name}${c.sfx}</b>
          <div class="tiny muted">${c.cls}の保育室／受付 ${hm(now())}</div></div></div>`).join('')}</div>
      <div style="margin-top:22px"><button class="btn" onclick="act('camReset')">最初の画面に戻る</button></div>
      <div class="tiny muted" style="margin-top:10px">10秒後に自動で最初の画面に戻ります</div>
    </div></div>`;
  }
  if(step==='checking'&&sel){
    return `<div class="tbody"><div class="kiosk" style="padding-top:30px">
      <div class="spin"></div>
      <h3 style="margin-top:18px">照合しています</h3>
      <div class="lead">${state.faceReady?'そのままお待ちください。':'初回は照合の準備に少し時間がかかります。'}</div>
      ${state.shot?`<div style="width:150px;height:170px;border-radius:16px;overflow:hidden;margin:0 auto"><img src="${state.shot}" alt="" style="width:100%;height:100%;object-fit:cover"></div>`:''}
    </div></div>`;
  }
  if(step==='called'){
    return `<div class="tbody"><div class="kiosk" style="padding-top:30px">
      <div style="width:104px;height:104px;border-radius:50%;background:var(--am-bg);display:grid;place-items:center;margin:0 auto">${ic('bell',54,'#D2941A')}</div>
      <h3 style="margin-top:18px">先生を呼びました</h3>
      <div class="lead">先生が玄関に来るまで、少しお待ちください。</div>${back}</div></div>`;
  }
  if(step==='fail'&&sel){
    const r=state.camResult||{kind:'nomatch'};
    const T={nomatch:['認証できませんでした','登録されている写真と一致しませんでした。<br>帽子・マスク・眼鏡を外し、正面を向いてもう一度撮影してください。',true],
             noface:['顔が見つかりませんでした','枠の中に顔が入るようにして、もう一度撮影してください。',true],
             nophoto:['写真が登録されていません','顔照合に使う写真が登録されていないため、先生が確認します。',false],
             regface:['登録写真を照合に使えません','登録されている写真から顔を確認できませんでした。先生が確認します。',false],
             engine:['照合できませんでした','通信状況を確認してもう一度お試しください。続く場合は先生が確認します。',true],
             live:['本人の確認ができませんでした','画面の指示に合わせて、まばたきと首の向きを変えてください。',true],
             invalid:['この登録では受付できません','登録の承認や有効期間を確認する必要があります。先生が確認します。',false]}[r.kind]
             ||['認証できませんでした','先生が確認します。',false];
    return `<div class="tbody"><div class="kiosk" style="padding-top:30px">
      <div style="width:104px;height:104px;border-radius:50%;background:var(--rd-bg);display:grid;place-items:center;margin:0 auto">${ic('info',54,'#DB5A45')}</div>
      <h3 style="margin-top:18px;color:var(--rd-tx)">${T[0]}</h3>
      <div class="lead">${T[1]}</div>
      <div style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap">
        ${T[2]?`<button class="btn" onclick="act('camRetake')">${ic('idcard',20)}もう一度撮影する</button>`:''}
        <button class="btn ${T[2]?'g':''}" onclick="act('camCall','${r.kind}')">${ic('bell',20)}先生を呼ぶ</button></div>${back}</div></div>`;
  }
  if(step==='who'&&sel){
    const ps=validProxies(sel.id);
    const sibs=famKids(sel.id).filter(k=>k.st==='waiting');
    const ck=state.camKids&&state.camKids.length?state.camKids:sibs.map(k=>k.id);
    if(!ps.length)return `<div class="tbody"><div class="kiosk" style="padding-top:30px">
      <h3>お迎えの方が登録されていません</h3>
      <div class="lead">先生を呼んで確認します。</div>
      <button class="btn" onclick="act('camCall','nophoto')">${ic('bell',20)}先生を呼ぶ</button>${back}</div></div>`;
    return `<div class="tbody"><div class="kiosk" style="padding-top:14px">
      <h3>どなたがお迎えですか？</h3>
      <div class="lead">${sibs.length>1?'お迎えするお子さまを確認し、ご自身を選んでください':sel.name+sel.sfx+'（'+sel.cls+'）'}</div>
      ${sibs.length>1?`<div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:16px">${sibs.map(k=>`
        <button class="chk ${ck.includes(k.id)?'on':''}" style="width:auto;margin:0" onclick="act('camKid','${k.id}')">
          <span class="box">${ic('check',14)}</span><span><b>${k.name}${k.sfx}</b>　${k.cls}</span></button>`).join('')}</div>`:''}
      <div class="pickgrid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">
        ${ps.map(pp=>`<button class="pickcard" onclick="act('${pp.src?'camWho':'camWhoStaff'}','${pp.id}')">
          ${kioskRole?`<div style="width:64px;height:64px;border-radius:50%;background:var(--o-l);display:grid;place-items:center;color:var(--o)">${ic('user',32)}</div>`
            :`<div style="width:84px;height:96px;border-radius:14px;overflow:hidden;background:#EFEDEA">${pic(pp)}</div>`}
          <b>${pp.name}</b><small>${pp.rel}</small>
          <span class="pill ${pp.src?'green':'amber'}">${pp.src?'カメラで顔照合':'先生を呼んで確認'}</span></button>`).join('')}
      </div>
      <div class="card" style="max-width:560px;margin:20px auto 0;padding:16px 18px;display:flex;gap:14px;align-items:center;text-align:left;flex-wrap:wrap">
        <div style="flex:1;min-width:220px"><b style="font-family:var(--disp);font-size:15px">顔写真を登録していない方</b>
          <div class="tiny muted" style="margin-top:3px">カメラは使わずに、先生が玄関で確認します</div></div>
        <button class="btn" onclick="act('camCallNoPerson')">${ic('bell',20)}先生を呼ぶ</button></div>
      ${back}</div></div>`;
  }
  if((step==='shoot'||step==='live')&&sel){
    const p=proxiesOf(sel.id).find(x=>x.id===state.camProxy)||proxiesOf(sel.id)[0];
    const err=state.camErr, live=step==='live';
    return `<div class="tbody"><div class="kiosk" style="padding-top:8px">
      <h3>${live?'画面の指示に合わせて動いてください':'カメラに顔を向けてください'}</h3>
      <div class="lead" id="liveMsg">${live?(state.liveMsg||'① ゆっくりまばたきをしてください'):`${p.name}さん（${p.rel}）
        <span class="pill ${state.faceReady?'green':'gray'}" style="margin-left:6px">${state.faceReady?'照合の準備完了':'照合を準備しています'}</span>`}</div>
      <div class="camwrap">
        ${camStream?`<video id="camView" autoplay playsinline muted></video><div class="guide"></div>`
         :err?`<div class="ph">カメラを使えませんでした。<br>${err==='denied'?'ブラウザでカメラの使用を許可してください。':'この端末ではカメラを直接使えません。'}<br>下のボタンから撮影できます。</div>`
         :`<div class="ph">「カメラを開始」を押してください。</div>`}
      </div>
      ${live?`<div class="tiny muted" style="margin-top:12px">まばたきと、毎回ちがう向きへの首振り（2回）で、目の前にご本人がいることを確かめています</div>
          <div style="margin-top:12px"><button class="btn g" onclick="act('camRetake')">やり直す</button></div>`
       :camStream?`<button class="shutter" onclick="act('shoot')">${ic('idcard',30,'#E4762A')}</button>
        <div class="tiny muted" style="margin-top:8px">${state.cam.live?'ボタンを押したあと、画面の指示に合わせてまばたきと首振りをすると撮影します':'ボタンを押すと撮影し、登録写真と照合します'}</div>`
       :`<div style="margin-top:14px;display:flex;gap:11px;justify-content:center;flex-wrap:wrap">
          <button class="btn" onclick="act('camStart')">${ic('idcard',20)}カメラを開始</button>
          <input type="file" id="camFile" accept="image/*" capture="user" style="display:none" onchange="act('camFile',this)">
          <button class="btn g" onclick="document.getElementById('camFile').click()">端末のカメラで撮影</button></div>`}
      ${live?'':back}</div></div>`;
  }
  if(step==='scan'){
    const err=state.camErr;
    return `<div class="tbody"><div class="kiosk" style="padding-top:8px">
      <h3>お迎えアプリのQRコードをかざしてください</h3>
      <div class="lead">アプリの「受付用QRコード」の画面を、カメラに向けてください</div>
      <div class="camwrap" style="max-width:520px;margin:0 auto">
        ${camStream?`<video id="camView" autoplay playsinline muted></video><div class="qrguide"></div>`
         :err?`<div class="ph">カメラを使えませんでした。<br>下に、QRコードの下にある8桁の番号を入力してください。</div>`
         :`<div class="ph">カメラを準備しています…</div>`}
      </div>
      ${state.scanErr?`<div class="err" style="max-width:520px;margin:12px auto 0">${state.scanErr}</div>`:''}
      <div style="margin-top:14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${camStream?'':`<input type="file" id="scanFile" accept="image/*" capture="environment" style="display:none" onchange="act('scanFile',this)">
          <button class="btn g" onclick="document.getElementById('scanFile').click()">${ic('idcard',20)}QRコードを撮影する</button>`}
      </div>
      <div class="card" style="max-width:460px;margin:16px auto 0;padding:14px 16px;text-align:left">
        <b style="font-family:var(--disp);font-size:14.5px">読み取れないときは</b>
        <div class="tiny muted" style="margin:3px 0 10px">QRコードの下にある8桁の番号を入力してください</div>
        <div class="compbox">${ic('idcard',18,'#BCADA1')}
          <input id="cardNoIn" inputmode="numeric" autocomplete="off" maxlength="11" placeholder="8桁の番号" style="font-family:var(--mono);letter-spacing:.12em;font-size:18px" onkeydown="if(event.key==='Enter')act('cardNo')">
          <button class="hpill solid" onclick="act('cardNo')">確定</button></div></div>
      ${back}</div></div>`;
  }
  if(step==='name'){
    return `<div class="tbody"><div class="kiosk" style="padding-top:8px">
      <h3>お名前でさがす</h3>
      <div class="lead">お子さまのお名前を入力してください</div>
      <div class="compbox" style="max-width:420px;margin:0 auto 14px">${ic('search',18,'#BCADA1')}
        <input id="camSearch" value="${esc(state.camq)}" placeholder="例）やまだ" oninput="act('camq',this.value)"></div>
      <div id="camList">${camListHTML()}</div>${back}</div></div>`;
  }

  /* 最初の画面 */
  if(kioskRole){
    return `<div class="tbody"><div class="kiosk" style="padding-top:16px">
      <h3>お迎えの受付</h3>
      <div class="lead">お迎えアプリのQRコードをカメラにかざしてください</div>
      <button class="pickcard" style="max-width:420px;width:100%;margin:0 auto;padding:26px 16px" onclick="act('scanStart')">
        <div style="width:84px;height:84px;border-radius:22px;background:var(--o-l);display:grid;place-items:center;color:var(--o)">${ic('idcard',46)}</div>

/* ---- 受付用QRコード ---- */
const QRGEN_URL='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
const JSQR_URL='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
const scriptP={};
function loadScript(url,globalName){
  if(globalName&&typeof window!=='undefined'&&window[globalName])return Promise.resolve();
  if(scriptP[url])return scriptP[url];
  scriptP[url]=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=url;sc.async=true;
    sc.onload=()=>res();sc.onerror=()=>{delete scriptP[url];rej(new Error('script'));};document.head.appendChild(sc);});
  return scriptP[url];
}
/* 受付用の番号は家庭ごとのランダムな数字8桁（タブレットの数字キーで入力しやすい）。
   QRコードには番号とは別の、20文字のランダムな文字列を入れる。連番ではないので推測できない */
function rnd32(n){const a=new Uint32Array(n);
  try{crypto.getRandomValues(a);}catch(e){for(let i=0;i<n;i++)a[i]=Math.floor(Math.random()*4294967296);}return a;}
/* 起動直後（初期データ作成時）にも呼ばれるため、文字の一覧は関数の中で持つ */
function randCode(n){const CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=rnd32(n);let r='';
  for(let i=0;i<n;i++)r+=CH.charAt(a[i]%CH.length);return r;}
function randDigits(n){const a=rnd32(n);let r='';for(let i=0;i<n;i++)r+=String(a[i]%10);return r;}
function newCard(used){let d;do{d=randDigits(8);}while((used&&used.has(d))||/^(\d)\1+$/.test(d));
  return{code:d.slice(0,4)+' '+d.slice(4),secret:randCode(20),issued:Date.now()};}
function cardsFor(children){const out={},used=new Set();
  children.forEach(c=>{const k=c.fam||c.id;if(!out[k]){out[k]=newCard(used);used.add(out[k].code.replace(/\D/g,''));}});return out;}
const cardOf=fk=>(state.cards||{})[fk]||null;
const cardNo=fk=>(cardOf(fk)||{}).code||'—';
const cardToken=fk=>'OKAERI2:'+state.schoolId+':'+((cardOf(fk)||{}).secret||'');
/* 入力された番号をそろえる（全角数字は半角に。空白・ハイフンは無視。数字以外の文字があれば無効） */
const zen2han=t=>String(t||'').replace(/[０-９]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0xFEE0));
const normCode=t=>{const z=zen2han(t);return /[^0-9\s\-ー－]/.test(z)?'':z.replace(/\D/g,'');};
function parseCard(text){
  const raw=String(text||'').trim();
  const m=raw.match(/^OKAERI2:([a-z0-9_-]+):([A-Z2-9]{20})$/);
  if(m){if(m[1]!==state.schoolId)return null;
    for(const [fk,c] of Object.entries(state.cards||{}))if(c.secret===m[2])return fk;return null;}
  const n=normCode(raw);if(n.length!==8)return null;
  for(const [fk,c] of Object.entries(state.cards||{}))if(normCode(c.code)===n)return fk;
  return null;
}
/* 番号・QRを3回まちがえたら1分間止めて先生を呼ぶ（番号を次々に試すことを防ぐ） */
let lastBad='';
function cardFound(text){
  if(state.cardLockUntil&&Date.now()<state.cardLockUntil){
    state.scanErr='しばらく受付できません。先生にお声がけください。';render();return false;}
  const other=String(text||'').match(/^OKAERI2:([a-z0-9_-]+):/);
  if(other&&other[1]!==state.schoolId){const o=schoolsAll().find(x=>x.id===other[1]);
    state.scanErr=(o?o.name:'ほかの園')+'のQRコードです。この園では受付できません。';render();return false;}
  const fk=parseCard(text);const kids=fk?famKids(fk):[];
  if(!kids.length){
    if(text!==lastBad){lastBad=text;state.cardFails=(state.cardFails||0)+1;}
    if(state.cardFails>=3){state.cardFails=0;state.cardLockUntil=Date.now()+60000;
      state.alerts.unshift({id:'a'+Date.now(),cid:null,pid:null,t:now(),why:'玄関で受付用の番号・QRコードを3回まちがえました',shot:''});
      addPost('受付カメラ','sys','【確認依頼】玄関で受付用の番号・QRコードが3回続けて一致しませんでした。対応をお願いします。',{auto:false,alert:true});
      stopCam();scanToken++;state.camStep='called';render();return false;}
    state.scanErr='このQRコード・番号は使えません。番号を確かめるか、先生にお声がけください。';render();return false;}
  const waiting=kids.filter(k=>k.st==='waiting');
  if(!waiting.length){state.scanErr='お子さまはすでに受付またはお迎え済みです。';render();return false;}
  stopCam();scanToken++;state.scanErr='';state.cardFails=0;lastBad='';
  state.camChild=waiting[0].id;state.camKids=waiting.map(k=>k.id);state.camProxy='';state.camStep='who';render();return true;
}
let scanToken=0;
async function runScan(){
  const token=++scanToken;let det=null;
  try{if(typeof BarcodeDetector!=='undefined'){const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']});}}catch(e){}
  if(!det){try{await withTimeout(loadScript(JSQR_URL,'jsQR'),15000);}catch(e){if(token===scanToken){state.scanErr='QRコードの読み取り機能を準備できませんでした。8桁の番号を入力してください。';render();}return;}}
  const cv=document.createElement('canvas');const g=cv.getContext('2d',{willReadFrequently:true});
  while(token===scanToken&&state.camStep==='scan'){
    const v=document.getElementById('camView');
    if(v&&v.videoWidth){let txt=null;
      try{
        if(det){const r=await det.detect(v);if(r&&r[0])txt=r[0].rawValue;}
        else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;g.drawImage(v,0,0,w,h);
          const r=jsQR(g.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'attemptBoth'});if(r)txt=r.data;}
      }catch(e){}
      if(txt&&cardFound(txt))return;
    }
    await sleep(250);
  }
}
async function decodeStill(dataUrl){
  const img=await imgEl(dataUrl);
  try{if(typeof BarcodeDetector!=='undefined'){const r=await new BarcodeDetector({formats:['qr_code']}).detect(img);if(r&&r[0])return r[0].rawValue;}}catch(e){}
  await withTimeout(loadScript(JSQR_URL,'jsQR'),15000);
  const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;const g=cv.getContext('2d');g.drawImage(img,0,0);
  const r=jsQR(g.getImageData(0,0,img.width,img.height).data,img.width,img.height,{inversionAttempts:'attemptBoth'});return r?r.data:null;
}
function qrHTML(text){
  if(typeof qrcode!=='undefined'){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(7,2);}catch(e){}}
  loadScript(QRGEN_URL,'qrcode').then(()=>{if(state.screen==='S08')render();}).catch(()=>{state.qrFail=true;if(state.screen==='S08')render();});
  return state.qrFail?`<div style="padding:30px 10px;color:#8B7E74;font-size:13px;text-align:center">QRコードを表示できません。<br>下の8桁の番号を玄関で入力してください。</div>`
                    :`<div class="spin" style="margin:40px auto"></div>`;
}

/* アカウントの園と家庭に合わせる。保護者・職員・受付端末は所属の園に、自治体はそのまま */
function acctSchool(a){return a.role==='admin'?'':(a.school||dataset().defaultSchool);}
function resolveFam(f){
  const fams=[];state.children.forEach(c=>{const k=c.fam||c.id;if(!fams.includes(k))fams.push(k);});
  const size=k=>state.children.filter(c=>(c.fam||c.id)===k).length;
  const gen=fams.filter(k=>!/^c\d+$/.test(k));
  if(f==='auto:siblings')return gen.find(k=>size(k)>1)||fams[0];
  if(f==='auto:single')return gen.find(k=>size(k)===1)||fams[0];
  return fams.includes(f)?f:fams[0];
}
function applyAccount(a){
  const sid=acctSchool(a);
  if(sid&&sid!==state.schoolId&&schoolsAll().some(x=>x.id===sid))switchSchool(sid);
  state.role=a.role;state.me=STAFF[a.id]||null;state.loginId=a.id;state.s10cls=(state.me&&state.me.cls)||'';
  if(a.role==='parent'){const fk=resolveFam(a.fam||'c1');const k=state.children.find(c=>(c.fam||c.id)===fk)||state.children[0];
    state.pc=k?k.id:'';state.pkids=null;state.pfamKey=fk;}
  state.screen=homeOf(a.role);state.camStep='pick';
}

/* 投稿を追加する。auto＝自動のお知らせ（最初はたたんで表示）、imp＝重要（上に固定）、alert＝確認依頼（赤で表示） */
function addPost(who,kind,txt,o){o=o||{};
  /* 職員が自分で書いた投稿は、書いた本人を「了解」に含める */
  const author=(state.role==='teacher'||state.role==='clerk')&&kind!=='sys'?[me().short]:[];
  state.posts.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),who,kind,t:now(),txt,ackBy:author,
  auto:o.auto!==undefined?!!o.auto:kind==='sys',imp:!!o.imp,alert:!!o.alert});}
/* 操作の記録（タイムラインには流さないもの） */
function addLog(txt){(state.logs=state.logs||[]).push({id:'l'+Date.now()+Math.random().toString(36).slice(2,5),t:now(),who:state.role==='parent'?'保護者アプリ':meWho(),txt});}
/* 了解した職員の一覧と、まだの職員 */
const ackList=p=>Array.isArray(p.ackBy)?p.ackBy:[];
const staffRoster=()=>Object.values(STAFF).map(x=>x.short);

/* =========================================================
   端末の連動
   ・設定なし：同じブラウザの別タブ・別ウィンドウと連動（再読み込みしても残る）
   ・Firebase の設定あり：別の端末どうしで連動
   データは「園児」「投稿」などの単位で送り、変わったものだけを書き込む
   ========================================================= */
const DEVICE=Math.random().toString(36).slice(2,10);
const FB_KEY='okaeri:firebase';
const lsKey=()=>'okaeri:data:v3:'+dataset()._ver+':'+state.schoolId;
/* データファイルが変わる前に保存された記録を消す（容量の節約と、古いデータが出てくるのを防ぐため） */
function purgeOldSaves(){try{const keep='okaeri:data:v3:'+dataset()._ver+':',old=[];
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('okaeri:data:')&&!k.startsWith(keep))old.push(k);}
  old.forEach(k=>localStorage.removeItem(k));}catch(e){}}
const FB_VER='10.12.2';
const Sync={mode:'local',status:'',err:'',ready:false,sent:{},timer:null,applying:false,bc:null,fs:null,col:null};

function entityMap(){
  const m={};
  const put=(k,o,fields)=>{const c=Object.assign({},o);delete c.desc;
    (fields||[]).forEach(f=>{if(c[f]){m['ph/'+k.replace('/','-')+'-'+f]={v:c[f]};c[f]='@ph';}});m[k]=c;};
  state.children.forEach(c=>put('children/'+c.id,c,['src','shot']));
  Object.entries(state.cards||{}).forEach(([fk,c])=>put('cards/'+fk,c));
  Object.entries(state.proxies).forEach(([fk,list])=>list.forEach((p,i)=>put('proxies/'+p.id,Object.assign({},p,{_fk:fk,_i:i}),['src'])));
  state.posts.forEach(x=>put('posts/'+x.id,x));
  state.records.forEach(x=>put('records/'+x.id,x,['shot']));
  state.alerts.forEach(x=>put('alerts/'+x.id,x,['shot']));
  state.notices.forEach(x=>put('notices/'+x.id,x));
  (state.logs||[]).forEach(x=>put('logs/'+x.id,x));
  state.absences.forEach(x=>put('absences/'+x.id,x));
  Object.entries(state.diary).forEach(([cid,list])=>put('diary/'+cid,{cid,list}));
  put('meta/settings',{thr:state.thr,cam:state.cam,offset:state.offset,clock24:state.clock24,dsVer:dataset()._ver});
  put('meta/stats',{stats:state.stats});
  return m;
}
function applyMap(M){
  if(!M['meta/settings'])return false;
  const ph=(k,f)=>(M['ph/'+k.replace('/','-')+'-'+f]||{}).v||'';
  const vals=pre=>Object.keys(M).filter(k=>k.startsWith(pre+'/')).map(k=>{const o=Object.assign({},M[k]);
    Object.keys(o).forEach(f=>{if(o[f]==='@ph')o[f]=ph(k,f);});return o;});
  const num=id=>Number(String(id).replace(/\D/g,''))||0;
  state.children=vals('children').sort((a,b)=>num(a.id)-num(b.id));
  const cd={};Object.keys(M).filter(k=>k.startsWith('cards/')).forEach(k=>cd[k.slice(6)]=M[k]);if(Object.keys(cd).length)state.cards=cd;
  const px={};vals('proxies').sort((a,b)=>a._i-b._i).forEach(p=>{const fk=p._fk;delete p._fk;delete p._i;
    p.desc=p.src?(descCache.get(p.src)||null):null;(px[fk]=px[fk]||[]).push(p);});
  state.proxies=px;
  state.posts=vals('posts').sort((a,b)=>a.t-b.t);
  state.records=vals('records').sort((a,b)=>a.t-b.t);
  state.alerts=vals('alerts').sort((a,b)=>b.t-a.t);
  state.notices=vals('notices').sort((a,b)=>b.t-a.t);
  state.logs=vals('logs').sort((a,b)=>a.t-b.t);
  state.absences=vals('absences').sort((a,b)=>(b.t||0)-(a.t||0));
  const di={};vals('diary').forEach(o=>di[o.cid]=o.list);state.diary=di;
  const st=M['meta/settings'];['thr','cam','stats','offset','clock24'].forEach(k=>{if(k in st)state[k]=st[k];});
  if(M['meta/stats']&&M['meta/stats'].stats)state.stats=M['meta/stats'].stats;
  return true;
}
function jsonMap(){const m=entityMap(),j={};for(const k in m)j[k]=JSON.stringify(m[k]);return j;}
function syncOut(){if(Sync.applying)return;clearTimeout(Sync.timer);Sync.timer=setTimeout(flushOut,200);}
/* まだ送っていない変更（通信が切れている間にたまる） */
function pendingKeys(){const cur=jsonMap(),ks=Object.keys(cur).filter(k=>Sync.sent[k]!==cur[k]);
  Object.keys(Sync.sent).forEach(k=>{if(!(k in cur))ks.push(k);});return ks;}
/* つながったとき：ほかの端末の変更を取り込んでから、この端末でたまっていた変更を送る */
function reconnect(){
  const pend=new Set(Sync.ready?pendingKeys():[]);
  if(Sync.mode==='local'){let saved=null;try{saved=JSON.parse(localStorage.getItem(lsKey())||'null');}catch(e){}
    if(saved){const d=diffFull(saved);Object.keys(d).forEach(k=>{if(pend.has(k))delete d[k];});if(Object.keys(d).length)syncIn(d);}}
  Sync.pendingN=0;flushOut();return pend.size;
}
function flushOut(){
  if(!Sync.ready)return;
  if(state.err){const n=pendingKeys().length;if(n!==Sync.pendingN){Sync.pendingN=n;const el=document.getElementById('offN');if(el)el.textContent=n;}return;}
  const cur=jsonMap(),delta={};
  for(const k in cur)if(Sync.sent[k]!==cur[k])delta[k]=cur[k];
  for(const k in Sync.sent)if(!(k in cur))delta[k]=null;
  if(!Object.keys(delta).length)return;
  for(const k in delta){if(delta[k]===null)delete Sync.sent[k];else Sync.sent[k]=delta[k];}
  if(Sync.mode==='firebase'&&Sync.col)fbWrite(delta);else localWrite(delta,cur);
}
/* 他の端末からの変更を取り込む */
function syncIn(delta){
  const cur=jsonMap();let changed=false;
  for(const k in delta){const v=delta[k];
    if(v===null){if(k in cur){delete cur[k];changed=true;}delete Sync.sent[k];}
    else{if(cur[k]!==v){cur[k]=v;changed=true;}Sync.sent[k]=v;}}
  if(!changed)return;
  const M={};for(const k in cur)M[k]=JSON.parse(cur[k]);
  Sync.applying=true;try{applyMap(M);}finally{Sync.applying=false;}
  render();
}
/* 保存済みの内容をまるごと採用する（起動時など） */
function adoptFull(full){
  const M={};for(const k in full)M[k]=JSON.parse(full[k]);
  Sync.applying=true;let ok=false;try{ok=applyMap(M);}finally{Sync.applying=false;}
  if(ok){Sync.sent=Object.assign({},full);render();}
  return ok;
}
function diffFull(full){const d={};for(const k in full)if(Sync.sent[k]!==full[k])d[k]=full[k];for(const k in Sync.sent)if(!(k in full))d[k]=null;return d;}

/* --- 同じ端末の中での連動 --- */
function localStart(){
  Sync.mode='local';
  purgeOldSaves();
  try{Sync.bc=new BroadcastChannel('okaeri-sync-'+dataset()._ver+'-'+state.schoolId);Sync.bc.onmessage=e=>{if(state.err)return;if(e.data&&e.data.from!==DEVICE)syncIn(e.data.delta);};}catch(e){Sync.bc=null;}
  try{window.addEventListener('storage',e=>{if(e.key===lsKey()&&e.newValue&&!Sync.bc){try{syncIn(diffFull(JSON.parse(e.newValue)));}catch(x){}}});}catch(e){}
  let saved=null;try{saved=JSON.parse(localStorage.getItem(lsKey())||'null');}catch(e){}
  if(saved)adoptFull(saved);
  Sync.ready=true;Sync.status='local';flushOut();
}
function localWrite(delta,full){
  try{localStorage.setItem(lsKey(),JSON.stringify(full));}
  catch(e){try{const lite={};for(const k in full)if(!k.startsWith('ph/'))lite[k]=full[k];localStorage.setItem(lsKey(),JSON.stringify(lite));}catch(x){}}
  try{Sync.bc&&Sync.bc.postMessage({from:DEVICE,delta});}catch(e){}
}

/* --- Firebase（別の端末と連動）
   ・端末ごとにメールアドレスとパスワードでサインインする
   ・okaeri_members/{メールアドレス} に登録された役割（role）で、読み書きできる範囲が決まる
   ・保護者は自分の家庭（fams）のデータと、園全体のお知らせ・設定だけを読める --- */
const ROLE_LABEL={staff:'保育士・事務',kiosk:'受付端末',admin:'自治体管理者',parent:'保護者'};
const roleLabel=r=>ROLE_LABEL[r]||'—';
const FB_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    function signedIn() {
      return request.auth != null && request.auth.token.email != null
        && exists(/databases/$(db)/documents/okaeri_members/$(request.auth.token.email.lower()));
    }
    function me() {
      return get(/databases/$(db)/documents/okaeri_members/$(request.auth.token.email.lower())).data;
    }
    function role(r) { return signedIn() && me().role == r; }
    function staffLike() { return role('staff') || role('kiosk'); }
    // 園ごとのデータ（okaeri_園のID）。school を登録した利用者は、その園のデータだけを使える
    function inSchool(col) {
      return col.matches('okaeri_.+') && col != 'okaeri_members'
        && (!('school' in me()) || col == 'okaeri_' + me().school);
    }

    // 利用者の登録はFirebaseコンソールから行う（アプリからは書き換えられない）
    match /okaeri_members/{email} {
      allow read: if request.auth != null && request.auth.token.email.lower() == email;
      allow write: if false;
    }
    match /{col}/{doc} {
      allow read: if inSchool(col) && (staffLike() || role('admin')
        || (role('parent') && resource.data.fam in me().fams.concat(['all', 'parents'])));
      allow create: if inSchool(col) && (staffLike()
        || (role('admin') && doc == 'meta__settings')
        || (role('parent') && (request.resource.data.fam in me().fams
              || doc.matches('posts__.*') || doc == 'meta__stats')));
      allow update: if inSchool(col) && (staffLike()
        || (role('admin') && doc == 'meta__settings')
        || (role('parent') && ((request.resource.data.fam in me().fams && resource.data.fam in me().fams)
              || doc == 'meta__stats')));
      allow delete: if inSchool(col) && staffLike();
    }
  }
}`;
function parseFbConfig(text){
  const o={};String(text||'').replace(/([A-Za-z]+)\s*["']?\s*:\s*["']([^"']+)["']/g,(_,k,v)=>{o[k]=v;return '';});
  return o.apiKey&&o.projectId?o:null;
}
/* データごとの「どの家庭のものか」 */
function famOfKey(k,j){
  const type=k.split('/')[0],rest=k.slice(k.indexOf('/')+1);
  let o=null;try{o=j?JSON.parse(j):null;}catch(e){}
  if(type==='children'||type==='diary'||type==='cards')return famKey(rest);
  if(type==='proxies')return (o&&o._fk)||'staff';
  if(type==='absences')return o&&o.cid?famKey(o.cid):'staff';
  if(type==='notices')return (o&&o.fam)||'parents';
  if(type==='meta')return 'all';
  if(type==='ph'){const m=rest.match(/^(\w+)-(.+)-(\w+)$/);if(!m)return 'staff';
    if(m[1]==='children')return famKey(m[2]);
    if(m[1]==='proxies'){const h=allProxies().find(x=>x.p.id===m[2]);return h?h.fk:'staff';}
    return 'staff';}
  return 'staff';
}
/* 立場ごとに書き込んでよいデータか（Firestoreのルールと同じ考え方。ルールに弾かれる書き込みを最初から送らない） */
function canWrite(k,fam,isNew){
  const r=Sync.role;
  if(r==='staff'||r==='kiosk')return true;
  if(r==='admin')return k==='meta/settings';
  if(r==='parent')return (Sync.fams||[]).includes(fam)||(k.startsWith('posts/')&&isNew)||k==='meta/stats';
  return false;
}
async function fbStart(cfg,pw){
  try{Sync.unsub&&Sync.unsub();}catch(e){}
  try{Sync.bc&&Sync.bc.close();}catch(e){}Sync.bc=null;
  Sync.mode='firebase';Sync.status='connecting';Sync.err='';Sync.ready=false;Sync.col=null;Sync.remote=new Set();Sync.created=new Set();render();
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  await withTimeout(loadScript(base+'firebase-app-compat.js','firebase'),20000);
  await withTimeout(loadScript(base+'firebase-auth-compat.js'),20000);
  await withTimeout(loadScript(base+'firebase-firestore-compat.js'),20000);
  const conf=Object.assign({},cfg);delete conf.email;
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(conf);
  const auth=firebase.auth(app);
  let user=null;
  if(pw)user=(await withTimeout(auth.signInWithEmailAndPassword(cfg.email,pw),20000)).user;
  else user=await withTimeout(new Promise(res=>{const u=auth.onAuthStateChanged(x=>{u();res(x);});}),15000);
  if(!user){Sync.status='login';Sync.err='パスワードを入力してサインインしてください';render();return;}
  Sync.fs=firebase.firestore(app);
  const email=String(user.email||'').toLowerCase();
  const mem=await withTimeout(Sync.fs.collection('okaeri_members').doc(email).get(),15000);
  if(!mem.exists){Sync.status='error';Sync.err=email+' は園の利用者として登録されていません（okaeri_members）';render();return;}
  const m=mem.data()||{};Sync.role=m.role||'';Sync.fams=Array.isArray(m.fams)?m.fams:[];Sync.email=email;
  if(!ROLE_LABEL[Sync.role]){Sync.status='error';Sync.err='役割（role）の登録が正しくありません';render();return;}
  if(m.school&&m.school!==state.schoolId&&schoolsAll().some(x=>x.id===m.school)){state.schoolId=m.school;Object.assign(state,freshData(m.school));}
  Sync.col=Sync.fs.collection('okaeri_'+state.schoolId);
  const q=Sync.role==='parent'?Sync.col.where('fam','in',Sync.fams.concat(['all','parents']).slice(0,30)):Sync.col;
  const seeds=Sync.role==='staff'||Sync.role==='kiosk';
  let first=true;
  Sync.unsub=q.onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{const x=ch.doc.data()||{};const k=x.k||ch.doc.id.replace(/__/g,'/');
      if(ch.type==='removed')Sync.remote.delete(k);else Sync.remote.add(k);});
    if(first){first=false;
      if(snap.empty){Sync.sent={};Sync.ready=true;if(seeds)flushOut();}
      else{const full={};snap.forEach(d=>{const x=d.data();if(x&&x.k)full[x.k]=x.j;});
        let remoteVer='';try{remoteVer=JSON.parse(full['meta/settings']||'{}').dsVer||'';}catch(e){}
        if(!adoptFull(full)&&seeds)Sync.sent=full;Sync.ready=true;
        if(remoteVer&&remoteVer!==dataset()._ver){Sync.status='connected';
          Sync.err='データファイルが更新されています。保育士の端末で操作バーの「リセット」を押すと、全端末が新しいデータにそろいます。';
          toast('データファイルが更新されています（「端末の連動」を確認）');render();return;}}
      Sync.status='connected';Sync.err='';render();return;}
    const delta={};
    snap.docChanges().forEach(ch=>{const x=ch.doc.data()||{};const k=x.k||ch.doc.id.replace(/__/g,'/');
      if(ch.type==='removed')delta[k]=null;else if(x.by!==DEVICE)delta[k]=x.j;});
    if(Object.keys(delta).length)syncIn(delta);
  },err=>{Sync.status='error';Sync.err=err&&err.code==='permission-denied'?'読み取りが許可されていません（ルールと利用者の登録を確認してください）':(err&&err.message)||'接続できませんでした';render();});
}
function fbWrite(delta){
  const ops=[];
  for(const k in delta){const v=delta[k];
    if(v===null){if(Sync.role==='staff'||Sync.role==='kiosk')ops.push({k,del:true});continue;}
    const fam=famOfKey(k,v),isNew=!Sync.remote.has(k)&&!Sync.created.has(k);
    if(!canWrite(k,fam,isNew))continue;
    ops.push({k,v,fam});if(isNew)Sync.created.add(k);}
  for(let i=0;i<ops.length;i+=400){const b=Sync.fs.batch();
    ops.slice(i,i+400).forEach(o=>{const ref=Sync.col.doc(o.k.replace(/\//g,'__'));
      if(o.del)b.delete(ref);else b.set(ref,{k:o.k,j:o.v,fam:o.fam,by:DEVICE,u:Date.now()});});
    b.commit().catch(e=>{Sync.status='error';Sync.err=e&&e.code==='permission-denied'?'書き込みが許可されていません（ルールと利用者の登録を確認してください）':(e&&e.message)||'書き込めませんでした';render();});}
}
/* 連動を止める（園を切り替えるとき・データを入れ替えるとき） */
function stopSync(){try{Sync.bc&&Sync.bc.close();}catch(e){}Sync.bc=null;try{Sync.unsub&&Sync.unsub();}catch(e){}Sync.unsub=null;
  Sync.ready=false;Sync.col=null;clearTimeout(Sync.timer);}
/* 表示する園を切り替える。園ごとにデータと連動先が分かれている */
function switchSchool(id){
  if(!schoolsAll().some(x=>x.id===id))return;
  stopSync();stopCam();
  state.schoolId=id;Object.assign(state,freshData(id));
  const first=state.children[0]?state.children[0].id:'';
  Object.assign(state,{childId:first,ag:{cls:'',q:'',cid:first},camStep:'pick',camChild:'',camKids:[],camProxy:'',
    s10cls:(state.me&&state.me.cls)||'',dcls:'',dq:'',camq:'',diaryChild:'',pc:'c1',hold:null,pending:null,lastChanged:[],q:''});
  Sync.sent={};startSync();
}
function startSync(){
  let cfg=null;try{cfg=JSON.parse(localStorage.getItem(FB_KEY)||'null');}catch(e){}
  if(cfg&&cfg.apiKey&&cfg.email){fbStart(cfg).catch(()=>{Sync.status='error';Sync.err='Firebaseに接続できませんでした';render();});}
  else localStart();
}
function syncLabel(){
  if(Sync.mode==='firebase')return Sync.status==='connected'?'別の端末と連動中（'+roleLabel(Sync.role)+'）'
    :Sync.status==='connecting'?'接続しています':Sync.status==='login'?'サインインが必要です':'接続できません';
  return Sync.bc?'この端末の別ウィンドウと連動中':'この端末だけで動作中';
}
/* =========================================================
   毎秒の更新
   ========================================================= */
function sig(){return state.children.map(c=>c.id+stat(c).k+(c.pickupAt<now()?'p':'f')).join('|');}
function tickLoop(){
  const hn=document.getElementById('hnow');if(hn)hn.textContent=md(now())+'('+wd(now())+') '+hm(now());
  const kc=document.getElementById('kclk');if(kc)kc.innerHTML=hmx(now());
  if(state.screen==='S10'||state.screen==='S11'){
    if(sig()!==lastSig){render();return;}
    document.querySelectorAll('[data-arr]').forEach(el=>{
      const c=child(el.dataset.arr);if(!c)return;
      const e=el.querySelector('.js-arr');if(e)e.textContent=elapsedText(c);});
    document.querySelectorAll('[data-cid]').forEach(el=>{
      const c=child(el.dataset.cid);if(!c)return;const t=countText(c);
      const b=el.querySelector('.js-big'),s=el.querySelector('.js-sub');
      if(b)b.textContent=t.big;if(s)s.textContent=t.sub;});
  }
}
setInterval(tickLoop,1000);
render();
startSync();
if(dataset()._from==='fallback')toast('データファイルを読み込めませんでした（「使っているデータ」を確認）');
</script>
