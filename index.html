<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リアルタイムお迎え動向共有システム｜プロトタイプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --o:#F2913F;            /* メインのオレンジ */
  --o-d:#E4762A;
  --o-l:#FDEBDD;          /* 淡いオレンジ面 */
  --o-l2:#FEF5EE;
  --side:#FFF9F4;         /* サイドバー */
  --peach:#FDF4EF;        /* 画面背景 */
  --card:#FFFFFF;
  --ink:#3D332C;
  --ink-2:#9A8C81;
  --line:#F1E8E1;
  --pink:#F2A7BC;
  --pri-bg:#FBE4DE; --pri-tx:#D9755C;   /* 優先順位 */
  --ok-bg:#E4F4E9;  --ok-tx:#3E9A62;    /* 承認済み・未到着 */
  --am-bg:#FDF0D9;  --am-tx:#D2941A;    /* まもなく */
  --rd-bg:#FCE6E2;  --rd-tx:#DB5A45;    /* 遅延 */
  --mint:#B4E3CC;   --mint-tx:#2E8B5F;
  --memo-bg:#FFFAEC; --memo-bd:#F0D9A8;
  --disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#EDE4DC;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:40px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
:focus-visible{outline:3px solid #F2B77E;outline-offset:2px;border-radius:6px}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== プロトタイプ操作バー（アプリの外側） ===== */
.harness{position:sticky;top:0;z-index:60;background:#3A2E27;color:#E3D6CB;border-bottom:2px solid var(--o)}
.harness-in{max-width:1200px;margin:0 auto;padding:9px 16px;display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center}
.harness .brand{font-family:var(--disp);font-weight:700;color:#fff;font-size:14px}
.harness .brand span{color:#F2B77E;font-size:11px;font-family:var(--mono);margin-left:8px;letter-spacing:.08em}
.hgroup{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:wrap}
.hctrls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.htoggle{display:none}
.hbtn{font-size:12px;padding:5px 11px;border-radius:999px;background:#503F35;color:#E9DCD1;border:1px solid #6A5648}
.hbtn:hover{background:#63503f}
.hbtn.on{background:var(--o);color:#fff;border-color:var(--o)}
.hnow{font-family:var(--mono);font-size:12px;color:#C7A98F}
.hid{font-family:var(--mono);font-size:11px;color:#3A2E27;background:#F2C79A;padding:3px 8px;border-radius:5px;font-weight:600}

/* ===== 端末フレーム ===== */
.stage{max-width:1200px;margin:22px auto;padding:0 16px;display:flex;justify-content:center}
.phone{width:392px;max-width:100%;border-radius:38px;border:9px solid #221B16;box-shadow:0 26px 60px rgba(60,40,25,.3);overflow:hidden;display:flex;flex-direction:column;height:800px;
       background:linear-gradient(180deg,#FFF7F0 0%,#FDEDE1 58%,#FCE7D8 100%)}
.tablet{width:100%;max-width:1080px;border-radius:22px;border:9px solid #221B16;box-shadow:0 26px 60px rgba(60,40,25,.3);overflow:hidden;display:flex;flex-direction:column;height:740px;background:var(--peach)}
.statusbar{display:flex;justify-content:space-between;font-size:12px;padding:9px 20px 3px;color:#6A5D53;font-family:var(--disp);font-weight:700}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.roll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.roll::-webkit-scrollbar{width:7px}
.roll::-webkit-scrollbar-thumb{background:#E3D2C4;border-radius:4px}

/* ===== 共通 ===== */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;font-family:var(--disp);white-space:nowrap}
.pill.green{background:var(--ok-bg);color:var(--ok-tx)}
.pill.amber{background:var(--am-bg);color:var(--am-tx)}
.pill.red{background:var(--rd-bg);color:var(--rd-tx)}
.pill.gray{background:#F0EBE6;color:#96887C}
.pill.pri{background:var(--pri-bg);color:var(--pri-tx)}
.pill.orange{background:var(--o-l);color:var(--o-d)}
.muted{color:var(--ink-2)}
.tiny{font-size:11.5px}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 3px rgba(120,90,60,.07)}
.note{background:var(--o-l2);border-radius:14px;padding:14px 16px;font-size:12.5px;color:#8A7365;line-height:1.75;display:flex;gap:10px}
.memo-row{background:var(--memo-bg);border:1px solid var(--memo-bd);border-radius:10px}
.err{background:var(--rd-bg);border:1px solid #F2C4BB;color:#B4402C;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.7}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#3A2E27;color:#fff;padding:12px 22px;border-radius:999px;font-size:13px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.28);font-family:var(--disp);font-weight:700;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}}
.fieldl{display:block;font-size:12.5px;font-weight:700;margin:15px 0 6px;color:#7A6B60;font-family:var(--disp)}
.inp{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:#fff}
.inp:focus{border-color:#F2C08A}
.sec{font-family:var(--disp);font-weight:700;font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
.sec:first-child{margin-top:0}

/* ===== タブレット：サイドバー ===== */
.t-wrap{display:flex;height:100%;min-height:0}
.side{width:214px;flex:none;background:var(--side);border-right:1px solid #F3E7DD;display:flex;flex-direction:column}
.side .logo{background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:11px;font-family:var(--disp);font-weight:700;font-size:17px}
.side .items{padding:12px 10px;overflow-y:auto;flex:1}
.side .items::-webkit-scrollbar{width:0}
.sidebtn{display:flex;gap:12px;align-items:center;width:100%;padding:11px 12px;border-radius:13px;font-family:var(--disp);font-weight:700;font-size:14px;color:#7C6A5D;text-align:left;margin-bottom:3px}
.sidebtn svg{color:#C99C6E}
.sidebtn:hover{background:#FDEEE2}
.sidebtn.on{background:var(--o-l);color:var(--o-d)}
.sidebtn.on svg{color:var(--o)}
.sidebtn[disabled]{opacity:.5;cursor:default}
.side .me{border-top:1px solid #F3E7DD;padding:11px 13px;display:flex;gap:10px;align-items:center;background:#FFF4EC}
.side .me b{font-family:var(--disp);font-size:13px;display:block}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--peach)}

/* ===== タブレット：ヘッダー ===== */
.thead{background:var(--peach);padding:18px 26px 10px;display:flex;align-items:flex-start;gap:12px}
.thead h2{margin:0;font-family:var(--disp);font-weight:700;font-size:23px;display:flex;align-items:center;gap:11px}
.thead .sub{font-size:12.5px;color:var(--ink-2);margin-top:5px}
.thead .right{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.hpill{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);color:#8A7A6D;font-size:13px;font-family:var(--disp);font-weight:700;padding:9px 16px;border-radius:999px}
.hpill:hover{background:#FFF8F3}
.hpill.solid{background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;border:none;box-shadow:0 3px 8px rgba(240,140,59,.32)}
.tbody{flex:1;overflow-y:auto;padding:8px 26px 26px}
.tbody::-webkit-scrollbar{width:7px}
.tbody::-webkit-scrollbar-thumb{background:#E3D2C4;border-radius:4px}
.tabs{display:flex;gap:9px;padding:0 26px 12px;flex-wrap:wrap;align-items:center}
.tab{font-size:13px;font-family:var(--disp);font-weight:700;padding:8px 16px;border-radius:999px;background:#fff;color:#9A8C81;border:1px solid var(--line)}
.tab.on{background:var(--o);color:#fff;border-color:var(--o)}

/* タブレット下部ナビ */
.tnav{background:#fff;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-around;padding:7px 0 9px;position:relative}
.tnav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-family:var(--disp);font-weight:700;color:#B2A499;flex:1}
.tnav button.on{color:var(--o)}
.tnav .fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;display:grid;place-items:center;margin-top:-24px;box-shadow:0 5px 14px rgba(240,140,59,.4)}
.tnav .fabwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--o);font-family:var(--disp);font-weight:700}
.badge{position:absolute;top:-4px;right:-9px;background:#EE5A48;color:#fff;font-size:9.5px;min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:700;padding:0 4px}

/* ===== 代理人リスト（画像1） ===== */
.pxcard{background:#fff;border-radius:18px;padding:20px;display:flex;gap:20px;align-items:flex-start;margin-bottom:16px;box-shadow:0 1px 3px rgba(120,90,60,.07);width:100%;text-align:left}
.pxcard:hover{box-shadow:0 4px 14px rgba(120,90,60,.13)}
.pxphoto{width:132px;height:150px;border-radius:12px;overflow:hidden;flex:none;background:#EFEBE7}
.pxinfo{flex:1;min-width:0}
.pxtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pxname{font-family:var(--disp);font-weight:700;font-size:25px;letter-spacing:.01em}
.pxname small{font-size:15px;color:#7E7168;font-weight:500;margin-left:6px}
.dl{margin-top:10px}
.dl .row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid #F4EEE9;font-size:14px}
.dl .row:last-child{border-bottom:none}
.dl .row .lb{color:#8B7E74;width:96px;flex:none;font-size:13.5px}
.dl .row svg{color:#BCADA1;flex:none}
.dl .row.memo{background:var(--memo-bg);border:1px solid var(--memo-bd);border-radius:10px;padding:9px 12px;margin:4px 0}
.dl .row.memo svg{color:#D6A94E}
.dl .row.memo b{font-weight:700}
.chev{align-self:center;color:#C9BAAE;flex:none}

/* ===== 職員タイムライン（画像2） ===== */
.composer{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.compbox{flex:1;background:#fff;border-radius:16px;border:1px solid var(--line);padding:8px 8px 8px 20px;display:flex;align-items:center;gap:10px}
.compbox input{flex:1;border:none;outline:none;font-size:15px;background:transparent}
.compbox input::placeholder{color:#BEB1A6}
.daysep{display:flex;justify-content:center;margin:6px 0 20px}
.daysep span{background:#fff;border-radius:999px;padding:9px 26px;font-family:var(--disp);font-weight:700;font-size:14px;color:#7A6B60;box-shadow:0 1px 3px rgba(120,90,60,.08)}
.post{display:flex;gap:16px;position:relative;padding-bottom:16px}
.post:not(:last-child):before{content:"";position:absolute;left:26px;top:56px;bottom:0;width:2px;background:#EFE4DA}
.post .bub{background:#fff;border-radius:18px;padding:16px 20px;flex:1;box-shadow:0 1px 3px rgba(120,90,60,.07);min-width:0}
.post .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post .who b{font-family:var(--disp);font-size:15px;color:var(--pink)}
.post .who .t{font-size:13px;color:#A79A8F;font-family:var(--mono)}
.post .who .more{margin-left:auto;color:#C4B6AA}
.post.teacher .who b{color:var(--o)}
.post.sys .who b{color:#5EA8C9}
.post .txt{font-size:15px;line-height:1.75}
.reacts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.react{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:12.5px;color:#8B7E74;background:#fff}
.react.on{background:var(--ok-bg);border-color:#C6E6D2;color:var(--ok-tx)}

/* ===== お帰りタイムライン ===== */
.ccard{display:flex;align-items:center;gap:15px;background:#fff;border-radius:16px;padding:14px 18px;width:100%;text-align:left;margin-bottom:11px;box-shadow:0 1px 3px rgba(120,90,60,.07);border-left:6px solid #DDD2C8}
.ccard:hover{box-shadow:0 4px 14px rgba(120,90,60,.13)}
.ccard.green{border-left-color:#5FBF8B}.ccard.amber{border-left-color:#EDB53F}
.ccard.red{border-left-color:#E8735C}.ccard.gray{border-left-color:#D8CDC4;opacity:.75}
.ccard.orange{border-left-color:var(--o);background:#FFF9F3}
.count.orange .num b{color:var(--o-d)}
.arrsec{background:#FFF4EA;border:1px solid #F6DCC4;border-radius:18px;padding:14px 15px;margin-bottom:16px}
.arrsec .hd{font-family:var(--disp);font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:11px;color:var(--o-d)}
.camwrap{position:relative;border-radius:18px;overflow:hidden;background:#241C17;aspect-ratio:4/3;display:grid;place-items:center}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.camwrap .guide{position:absolute;left:24%;right:24%;top:10%;bottom:14%;border:3px dashed rgba(255,255,255,.7);border-radius:50% 50% 46% 46%}
.camwrap .ph{color:#B9A896;font-size:13px;text-align:center;padding:24px;line-height:1.8}
.shutter{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid var(--o);margin:14px auto 0;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.shutter:active{transform:scale(.96)}
.kiosk{max-width:860px;margin:0 auto;text-align:center}
.kiosk h3{font-family:var(--disp);font-weight:900;font-size:26px;margin:4px 0 6px}
.kiosk .lead{font-size:15px;color:var(--ink-2);margin-bottom:18px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pickcard{background:#fff;border-radius:18px;padding:16px 12px;box-shadow:0 1px 3px rgba(120,90,60,.08);display:grid;justify-items:center;gap:8px}
.pickcard:hover{box-shadow:0 5px 16px rgba(120,90,60,.16)}
.pickcard b{font-family:var(--disp);font-size:16px}
.pickcard small{color:var(--ink-2);font-size:11.5px}
.arrbig{background:#fff;border-radius:20px;padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:12px;
        box-shadow:0 4px 18px rgba(228,118,42,.18);border:2px solid #F3C089;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 4px 18px rgba(228,118,42,.18)}50%{box-shadow:0 4px 26px rgba(228,118,42,.34)}}
.arrbig .big{font-family:var(--disp);font-weight:900;font-size:27px;line-height:1.2}
.arrbig .room{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--o-d);margin-top:3px}
.arrbig .elapse{font-family:var(--disp);font-weight:900;font-size:30px;color:var(--o-d);font-variant-numeric:tabular-nums}
.arrbig .thumbs{display:flex;gap:8px;align-items:center}
.arrbig .th{width:62px;height:72px;border-radius:12px;overflow:hidden;background:#EFEDEA;flex:none}
.arrbig .th img{width:100%;height:100%;object-fit:cover;display:block}
.arrbig .acts{margin-left:auto;display:grid;gap:8px;justify-items:stretch}
@media(max-width:820px){.arrbig{flex-wrap:wrap}.arrbig .acts{margin-left:0;width:100%;grid-template-columns:1fr 1fr}}
.shotbox{border-radius:18px;overflow:hidden;aspect-ratio:1/1.05;background:#EFEDEA}
.shotbox img{width:100%;height:100%;object-fit:cover;display:block}
.ccard .nm{font-family:var(--disp);font-weight:700;font-size:17px;margin-top:1px}
.ccard .meta{font-size:12px;color:var(--ink-2);margin-top:3px}
.count{margin-left:auto;text-align:right;min-width:118px}
.count .num{font-family:var(--disp);font-weight:900;font-size:15px;color:#8B7E74;margin-top:6px;font-variant-numeric:tabular-nums}
.count .num b{font-size:30px;line-height:1}
.count.green .num b{color:var(--ok-tx)}.count.amber .num b{color:var(--am-tx)}.count.red .num b{color:var(--rd-tx)}
.nowbar{display:flex;align-items:center;gap:10px;margin:6px 0 16px;color:var(--rd-tx);font-family:var(--disp);font-weight:700;font-size:12.5px}
.nowbar:after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,#F0B3A6 0 8px,transparent 8px 14px)}
.chgtag{display:inline-block;font-size:11px;background:var(--o-l);color:var(--o-d);padding:3px 9px;border-radius:7px;margin-top:5px;font-family:var(--disp);font-weight:700}
.stat{background:#fff;border-radius:18px;padding:17px 19px;box-shadow:0 1px 3px rgba(120,90,60,.07)}
.stat b{display:block;font-family:var(--disp);font-size:30px;color:var(--ink);line-height:1.25;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.tile{background:#fff;border-radius:18px;padding:17px 19px;text-align:left;box-shadow:0 1px 3px rgba(120,90,60,.07)}
.tile:hover{box-shadow:0 4px 14px rgba(120,90,60,.13)}
.tile b{display:block;font-family:var(--disp);font-size:15px;margin:9px 0 3px}
.tile small{color:var(--ink-2);font-size:12px}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:16px;overflow:hidden;font-size:13.5px;box-shadow:0 1px 3px rgba(120,90,60,.07)}
table.tbl th{background:#FBF3EC;text-align:left;padding:11px 15px;font-size:12px;color:#8B7E74;font-family:var(--disp);font-weight:700}
table.tbl td{padding:12px 15px;border-top:1px solid #F4EEE9}
.btn{background:linear-gradient(100deg,#F5A55E,#F08C3B);color:#fff;font-family:var(--disp);font-weight:700;font-size:14px;padding:13px 24px;border-radius:14px;box-shadow:0 3px 8px rgba(240,140,59,.3);display:inline-flex;align-items:center;gap:8px}
.btn.g{background:#fff;color:#7A6B60;border:1.5px solid var(--line);box-shadow:none}
.btn.ok{background:linear-gradient(100deg,#6DC79A,#48A876);box-shadow:0 3px 8px rgba(72,168,118,.3)}
.btn.ng{background:#fff;color:var(--rd-tx);border:1.5px solid #F2C4BB;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}

/* ===== 保護者アプリ（画像3） ===== */
.phead{display:flex;align-items:center;padding:10px 18px 12px;gap:10px}
.phead .ttl{flex:1;text-align:center;font-family:var(--disp);font-weight:700;font-size:19px}
.pbody{padding:0 18px 26px;position:relative}
.kidcard{background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 2px 8px rgba(150,110,70,.09)}
.kidcard .nm{font-family:var(--disp);font-weight:700;font-size:19px}
.kidcard .cls{font-size:13px;color:#8B7E74}
.timebox{background:var(--o-l);border-radius:13px;padding:7px 14px;text-align:center;margin-left:auto}
.timebox small{display:block;font-size:10.5px;color:#A88355}
.timebox b{font-family:var(--disp);font-weight:900;font-size:25px;color:var(--o-d);line-height:1.15;font-variant-numeric:tabular-nums}
.leadline{text-align:center;font-family:var(--disp);font-weight:700;font-size:17px;margin:20px 0 14px;position:relative;z-index:1}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.bigchoice button{border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;font-family:var(--disp);font-weight:700;font-size:19px;position:relative}
.bigchoice .cc{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center}
.bigchoice .late{background:#FBEEE4;color:#B98A5E}

/* 画像を読み込んで縮小し、data URL で返す */
function readImage(file,cb){
  if(!file)return;
  if(!/^image\//.test(file.type)){toast('画像ファイルを選んでください');return;}
  const fr=new FileReader();
  fr.onload=e=>{const img=new Image();
    img.onload=()=>{const max=720,sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL('image/jpeg',0.85));};
    img.onerror=()=>toast('この画像は読み込めませんでした');
    img.src=e.target.result;};
  fr.onerror=()=>toast('画像を読み込めませんでした');
  fr.readAsDataURL(file);
}
/* ---- 受付カメラ ---- */
let camStream=null;
function camAvailable(){return typeof navigator!=='undefined'&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia;}
function startCam(){
  if(camStream||!camAvailable()){if(!camAvailable())state.camErr='unsupported';render();return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280}},audio:false})
    .then(st=>{camStream=st;state.camErr='';render();})
    .catch(()=>{state.camErr='denied';render();});
}
function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}}
function attachCam(){const v=document.getElementById('camView');
  if(v&&camStream&&v.srcObject!==camStream){v.srcObject=camStream;const pr=v.play&&v.play();if(pr&&pr.catch)pr.catch(()=>{});}}
function shoot(){
  const v=document.getElementById('camView');
  if(!v||!v.videoWidth){toast('カメラの準備ができていません');return;}
  const max=720,sc=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));
  const cv=document.createElement('canvas');
  cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
  const g=cv.getContext('2d');g.translate(cv.width,0);g.scale(-1,1);
  g.drawImage(v,0,0,cv.width,cv.height);
  state.shot=cv.toDataURL('image/jpeg',0.85);
  stopCam();checkIn();
}
/* 受付の確定：園児を「到着」にして、保育士の画面へ大きく出す */
function checkIn(){
  const c=child(state.camChild);if(!c)return;
  const p=proxiesOf(c.id).find(x=>x.id===state.camProxy)||proxiesOf(c.id)[0];
  c.st='arrived';c.arrivedAt=now();c.arrivedBy=p.name+'（'+p.rel+'）';
  c.shot=state.cam.keep?state.shot:'';c.verified=p.id;c.prep='';
  addPost('受付カメラ','sys',`【到着】${c.name}${c.sfx}：${p.name}さん（${p.rel}）が玄関で受付しました。${c.cls}の保育室で引き渡しをお願いします。`);
  state.notices.unshift({id:'n'+Date.now(),kind:'お迎え連絡',title:'受付が完了しました',
    body:c.name+c.sfx+'の先生にお迎えをお知らせしました。保育室でお待ちください。',t:now(),read:false});
  state.camStep='done';state.shotTmp=state.shot;state.shot='';render();
}

/* =========================================================
   時刻・ステータス
   ========================================================= */
const now=()=>Date.now()+state.offset;
const pad=n=>String(n).padStart(2,'0');
function hmParts(ts){const d=new Date(ts),h=d.getHours(),m=pad(d.getMinutes());
  if(state.clock24)return{t:h+':'+m,ap:''};
  const ap=h<12?'AM':'PM';let h12=h%12;if(h12===0)h12=12;
  return{t:h12+':'+m,ap};}
const hm=ts=>{const p=hmParts(ts);return p.ap?p.t+' '+p.ap:p.t;};
const hmx=ts=>{const p=hmParts(ts);return p.t+(p.ap?`<span class="ampm">${p.ap}</span>`:'');};
const md=ts=>{const d=new Date(ts);return (d.getMonth()+1)+'月'+d.getDate()+'日';};
const wd=ts=>'日月火水木金土'[new Date(ts).getDay()];
const child=id=>state.children.find(c=>c.id===id);
const proxiesOf=id=>state.proxies[id]||[{id:'px_'+id,name:(child(id).by||'').split(' ').slice(1).join(' '),kana:'',rel:(child(id).by||'').split(' ')[0],tel:'—',photo:0,auth:'特徴メモで確認（事前登録）',memo:'未登録',prio:1,ok:true}];
function stat(c){
  if(c.st==='released')return{k:'released',label:'降園済み',tone:'gray'};
  if(c.st==='arrived') return{k:'arrived',label:'お迎えの方が到着',tone:'orange'};
  const m=(c.pickupAt-now())/60000;
  if(m<0)return{k:'late',label:'遅延中',tone:'red'};
  if(m<=state.thr.soon)return{k:'soon',label:'まもなく到着',tone:'amber'};
  return{k:'waiting',label:'未到着',tone:'green'};
}
function countText(c){
  const s=stat(c);
  if(s.k==='released')return{big:'降園済み',sub:'受け渡し完了',plain:1};
  if(s.k==='arrived') return{big:'引き渡し待ち',sub:hm(c.arrivedAt||c.pickupAt)+'に到着',plain:1};
  const d=(c.pickupAt-now())/60000;
  if(d<0)return{big:Math.max(1,Math.floor(-d)),sub:hm(c.pickupAt)+'を'+Math.max(1,Math.floor(-d))+'分過ぎています',pre:'あと'};
  return{big:Math.max(0,Math.ceil(d)),sub:hm(c.pickupAt)+'に到着予定',pre:'あと'};
}

}

function qrSVG(seed){
  let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;
  const n=21,cells=[];const fin=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    if(fin(x,y)){const fx=x<7?x:x-(n-7),fy=y<7?y:y-(n-7);
      if((fx===0||fx===6||fy===0||fy===6)||(fx>=2&&fx<=4&&fy>=2&&fy<=4))cells.push([x,y]);}
    else{h=(h*1103515245+12345)>>>0;if((h>>>16)%100<47)cells.push([x,y]);}}
  return `<svg viewBox="0 0 ${n} ${n}" width="152" height="152" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/>
    ${cells.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="#3D332C"/>`).join('')}</svg>`;
}

SCR.S10=()=>{
  const f=state.filter,all=curSchool().data?state.children.slice():[];
  const match=c=>{const k=stat(c).k;return f==='all'||(f==='yet'&&(k==='waiting'||k==='soon'))||(f==='arr'&&k==='arrived')||(f==='done'&&k==='released')||(f==='late'&&k==='late');};
  const arrived=all.filter(c=>c.st==='arrived').sort((a,b)=>(a.arrivedAt||a.pickupAt)-(b.arrivedAt||b.pickupAt)).filter(match);
  const waiting=all.filter(c=>c.st==='waiting').sort((a,b)=>a.pickupAt-b.pickupAt);
  const done=all.filter(c=>c.st==='released').sort((a,b)=>b.pickupAt-a.pickupAt);
  const past=waiting.filter(c=>c.pickupAt<now()).filter(match),future=waiting.filter(c=>c.pickupAt>=now()).filter(match),doneF=done.filter(match);
  const counts={all:all.length,arr:all.filter(c=>c.st==='arrived').length,yet:waiting.filter(c=>c.pickupAt>=now()).length,
                done:done.length,late:waiting.filter(c=>c.pickupAt<now()).length};
  const right=`<button class="hpill">${ic('filter',18)}絞り込み</button><button class="hpill">${ic('clock',18)}自動更新中</button>`;
  return thead('お帰りタイムライン','clock',md(now())+'（'+wd(now())+'）'+curSchool().name,right)
   +`<div class="tabs">${[['all','すべて'],['arr','到着'],['yet','未到着'],['late','遅延'],['done','受け渡し済み']].map(([k,l])=>
       `<button class="tab ${f===k?'on':''}" onclick="act('filter','${k}')">${l}（${counts[k]}）</button>`).join('')}</div>
     <div class="tbody">
      ${arrived.length?`<div class="arrsec"><div class="hd">${ic('check',19)}お迎えの方が到着しています（${arrived.length}名）</div>
        ${arrived.map(arrivedRow).join('')}</div>`:''}
      ${past.map(cardRow).join('')}
      ${(past.length&&future.length)?`<div class="nowbar">現在 ${hm(now())}</div>`:''}

/* --- S28 受付写真の確認（保育士側） --- */
SCR.S28=()=>{
  const c=child(state.camChild)||state.children[0];
  const p=proxiesOf(c.id).find(x=>x.id===c.verified)||proxiesOf(c.id)[0];
  return thead('受付写真の確認','idcard',c.name+c.sfx+'（'+c.cls+'）',`<button class="hpill" onclick="act('go','S10')">${ic('back',18)}お帰りタイムライン</button>`)
  +`<div class="tbody"><div class="grid2" style="align-items:start">
    <div class="card" style="padding:18px">
      <div class="shotbox">${c.shot?`<img src="${c.shot}" alt="">`:`<div style="display:grid;place-items:center;height:100%;color:#A6988C;font-size:13px;text-align:center;padding:20px">受付の写真は保存していません。<br>登録写真と目の前の方を見比べて確認してください。</div>`}</div>
      <div class="tiny muted" style="margin-top:9px">玄関で撮影した写真（${hm(c.arrivedAt||now())}）</div></div>
    <div class="card" style="padding:18px">
      <div class="shotbox">${pic(p)}</div>
      <div class="tiny muted" style="margin-top:9px">登録写真：${p.name}（${p.rel}）</div>
      ${p.photo?'':`<div class="memo-row" style="margin-top:10px;padding:11px 13px;font-size:13px;color:#8A7549">特徴メモ：${p.memo||'未登録'}</div>`}</div>
  </div>
  <div class="note" style="margin-top:15px">${ic('info',20,'#C9AE8E')}<div>写真を見比べて、職員が確認してください。確認方法と担当した職員が記録に残ります。</div></div>
  <div style="display:flex;gap:11px;margin-top:16px;flex-wrap:wrap">
    <button class="btn ok" onclick="act('quickRelease','${c.id}')">${ic('check',20)}本人と確認できた｜引き渡し完了</button>
    <button class="btn ng" onclick="act('camHold','${c.id}')">確認できない｜保留にする</button></div></div>`;
};

/* =========================================================
   アクション
   ========================================================= */
function act(name,arg){
  const blocked=['quickPost','postMemo','submitAgent','release','matchOk','holdOk','holdNg','ack','saveReply','saveThr',
    'quickRelease','prepStart','camHold','shoot','camFile','camSet','clock24'];
  if(state.role==='admin'&&blocked.includes(name)){toast('保育課のアカウントは閲覧のみです');return;}
  if(!['agq','tlq','dq'].includes(name))state.focusId='';
  switch(name){
    case 'go': state.screen=arg; state.sendErr=false; state.drawer=false; break;
    case 'drawer': state.drawer=!state.drawer; break;
    case 'hbar': state.hbar=!state.hbar; break;
    case 'jump': state.modal=null;
      state.role=arg==='S01'?null:PARENT.includes(arg)?'parent':(arg==='S19'||arg==='S20'||arg==='S26')?'admin':(arg==='S17'?'clerk':'teacher');
      state.screen=arg; state.drawer=false; break;
    case 'fill':{const a=ACCOUNTS.find(x=>x.id===arg);if(a){state.loginId=a.id;state.loginPw=a.pw;state.loginErr='';}break;}
    case 'login':{
      const id=(document.getElementById('lid')||{}).value||'', pw=(document.getElementById('lpw')||{}).value||'';
      state.loginId=id;state.loginPw=pw;
      if(!id.trim()){state.loginErr='利用者IDを入力してください。';break;}
      if(!pw){state.loginErr='パスワードを入力してください。';break;}
      const a=ACCOUNTS.find(x=>x.id===id.trim()&&x.pw===pw);
      if(!a){state.loginErr='IDまたはパスワードが違います。もう一度確認してください。';break;}
      state.loginErr='';state.role=a.role;state.loginPw='';
      state.screen=a.role==='parent'?'S02':a.role==='admin'?'S19':'S09';
      toast(a.label+'としてログインしました');break;}
    case 'logout': reset();toast('ログアウトしました');break;
    case 'viewonly': toast('保育課のアカウントは閲覧のみです');break;
    case 'toggleSet': state.settings[arg]=!state.settings[arg];break;
    case 'callSchool': toast('さくら保育園　044-000-0000');break;
    case 'dir': state.sel.dir=arg;state.sel.min=null;state.sel.custom='';break;
    case 'min': state.sel.min=(state.sel.min===arg?null:arg);state.sel.custom='';break;
    case 'custom': state.sel.custom=arg;state.sel.min=null;break;
    case 'focusCustom': state.showCustom=true;break;
    case 'submitPickup':{const nt=calcNew();if(!nt)break;
      if(state.err){state.sendErr=true;
        state.pending={label:'お迎え時間の変更（'+hm(nt)+'）',at:now()};
        toast('園に届きませんでした');break;}
      const c=child('c1'),before=c.pickupAt;if(!c.changed)c.planAt=before;
      c.pickupAt=nt;c.changed='保護者アプリ';c.changedAt=now();state.pending=null;
      state.notices.unshift({id:'n'+Date.now(),kind:'お迎え連絡',title:'お迎え時間の変更を園が受け取りました',
        body:hm(before)+' から '+hm(nt)+' に変更しました。',t:now(),read:false});
      addPost('保護者アプリ','sys',`${c.name}${c.sfx}の保護者の方から連絡があり、<br>お迎えが ${hm(before)} → <b>${hm(nt)}</b> に変わります。`);
      state.sendErr=false;state.sel.min=null;state.sel.custom='';state.screen='S04';toast('園のタイムラインに反映しました');break;}
    case 'absMulti': state.absMulti=!!arg;break;
    case 'submitAbsence':{const t=document.getElementById('abType').value,x=document.getElementById('abTxt').value;
      let d;
      if(state.absMulti){const f=document.getElementById('abFrom').value,to=document.getElementById('abTo').value;
        if(!f||!to){toast('開始日と終了日を選んでください');break;}
        if(to<f){toast('終了日は開始日より後にしてください');break;}
        const days=Math.round((new Date(to)-new Date(f))/86400000)+1;
        d=f+' 〜 '+to+'（'+days+'日間）';
      } else { d=document.getElementById('abDate').value; }
      state.absences.unshift({type:t,date:d,txt:x});const c=child('c1');
      addPost('保護者アプリ','sys',`${c.name}${c.sfx}の保護者から「${t}」の連絡がありました。${x?'（'+x+'）':''}`);
      toast('園に送信しました');break;}
    case 'saveDiary':{const temp=document.getElementById('dTemp').value||'—',mood=document.getElementById('dMood').value,txt=document.getElementById('dTxt').value;
      state.diary.c1.unshift({d:md(now())+'（'+wd(now())+'）',temp,mood,txt:txt||'（記入なし）',reply:''});toast('連絡帳を保存しました');break;}
    case 'pxFile': readImage(arg&&arg.files&&arg.files[0],d=>{state.pxSrc=d;state.pxPhoto=true;render();toast('写真を読み込みました');});return;
    case 'pxClear': state.pxSrc='';state.pxPhoto=false;break;
    case 'kidFile': readImage(arg&&arg.files&&arg.files[0],d=>{child('c1').src=d;render();toast('写真を変更しました');});return;
    case 'savePx':{const n=document.getElementById('pxName').value.trim();
      if(!n){toast('氏名を入力してください');break;}
      (state.proxies.c1=state.proxies.c1||[]).push({id:'px'+Date.now(),name:n,kana:'',rel:document.getElementById('pxRel').value||'—',
        tel:document.getElementById('pxTel').value,photo:state.pxSrc?1:0,src:state.pxSrc||'',style:0,
        auth:state.pxSrc?'写真を見て確認（登録済み）':'特徴メモで確認（事前登録）',
        memo:document.getElementById('pxMemo').value,prio:(state.proxies.c1||[]).length+1,ok:false});
      state.pxPhoto=false;state.pxSrc='';toast('保存しました。園の承認をお待ちください');break;}
    case 'filter': state.filter=arg;break;
    case 'camCls': state.camcls=arg;break;
    case 'camq': state.camq=arg;state.focusId='camSearch';break;
    case 'camPick': state.camChild=arg;state.camProxy='';state.camStep='who';break;
    case 'camWho': state.camProxy=arg;state.camStep='shoot';state.camErr='';startCam();break;
    case 'camStart': startCam();return;
    case 'shoot': shoot();return;
    case 'camFile': readImage(arg&&arg.files&&arg.files[0],d=>{state.shot=d;checkIn();});return;
    case 'camReset': stopCam();state.camStep='pick';state.camChild='';state.camProxy='';state.camErr='';state.shot='';break;
    case 'camFrom':{state.camChild=state.childId;state.camProxy=arg;state.camStep='shoot';state.screen='S27';state.camErr='';startCam();return;}
    case 'camCheck': state.camChild=arg;state.childId=arg;state.screen='S28';break;
    case 'camHold': state.childId=arg;state.hold={steps:{},who:child(arg).arrivedBy||''};state.screen='S24';
      toast('引き渡しを保留にしました');break;
    case 'camSet': state.cam[arg]=!state.cam[arg];break;
    case 'clock24': state.clock24=!state.clock24;break;
    case 'prepStart':{const c=child(arg);c.prep=state.role==='clerk'?'渡辺':'佐々木';
      addPost(state.role==='clerk'?'事務スタッフ':'担任',state.role==='clerk'?'clerk':'teacher',
        `${c.name}${c.sfx}の引き渡し準備に向かいます。`);
      toast('準備中にしました');break;}
    case 'quickRelease':{const c=child(arg);c.st='released';
      state.records.push({t:now(),child:c.name+c.sfx,to:c.arrivedBy||c.by,
        how:c.shot?'受付カメラの写真と登録写真を確認':(c.verified?'受付カメラ（写真は非保存）＋職員確認':'職員が確認'),
        shot:c.shot||'',staff:state.role==='clerk'?'渡辺 さくら（事務）':'佐々木 みなみ（ひまわり組）'});
      addPost(state.role==='clerk'?'事務スタッフ':'担任',state.role==='clerk'?'clerk':'teacher',
        `${c.name}${c.sfx}を${c.arrivedBy||c.by}へ引き渡しました。（${hm(now())}）`);
      c.shot='';state.screen='S10';toast('引き渡しを記録しました');break;}
    case 'toggleSearch': state.showSearch=!state.showSearch;if(state.showSearch)state.focusId='tlSearch';else state.q='';break;
    case 'tlq': state.q=arg;state.focusId='tlSearch';break;
    case 'cyclePF':{const o=['all','clerk','teacher','sys'];state.pfilter=o[(o.indexOf(state.pfilter)+1)%o.length];break;}
    case 'agCls': state.ag.cls=arg;break;
    case 'agq': state.ag.q=arg;state.focusId='agSearch';break;
    case 'agPick': state.ag.cid=arg;break;
    case 'dcls': state.dcls=arg;break;
    case 'dq': state.dq=arg;state.focusId='dSearch';break;
    case 'pickDiary': state.diaryChild=arg;break;
    case 'saveReply':{const el=document.getElementById('dReply');const t=(el&&el.value||'').trim();
      if(!t){toast('返信の内容を入力してください');break;}
      const cid=state.diaryChild,list=state.diary[cid]=state.diary[cid]||[];
      if(list.length)list[0].reply=t;else list.unshift({d:md(now())+'（'+wd(now())+'）',temp:'—',mood:'—',txt:'（保護者の記入なし）',reply:t});
      toast('保護者に返信しました');break;}
    case 'readNotice':{const n=state.notices.find(x=>x.id===arg);if(n)n.read=true;break;}
    case 'readAll': state.notices.forEach(n=>n.read=true);toast('すべて既読にしました');break;
    case 'school':{state.schoolId=arg;state.screen='S10';
      toast(curSchool().name+'の画面に切り替えました');break;}
    case 'openChild': state.childId=arg;state.screen='S11';break;
    case 'goHandover': state.childId=arg;state.sel.proxyName=child(arg).by;state.sel.how='保護者本人';state.screen='S14';break;
    case 'pickProxy': state.sel.proxy=arg;state.screen='S13';break;
    case 'matchOk':{const p=proxiesOf(state.childId).find(x=>x.id===state.sel.proxy)||proxiesOf(state.childId)[0];
      state.sel.proxyName=p.name+'（'+p.rel+'）';
      state.sel.how=p.photo?'登録写真と見比べて確認':'特徴メモで確認';
      state.screen='S14';break;}
    case 'matchNg': state.hold={steps:{},who:''};state.screen='S24';toast('引き渡しを保留にしました');break;
    case 'holdStart': state.hold={steps:{},who:''};state.screen='S24';break;
    case 'holdStep':{const h=state.hold=state.hold||{steps:{},who:''};
      const w=document.getElementById('holdWho');if(w)h.who=w.value;
      h.steps[arg]=!h.steps[arg];break;}
    case 'holdOk':{const h=state.hold||{};const w=document.getElementById('holdWho');
      state.sel.proxyName=(w&&w.value?w.value:'来園者')+'（保護者へ電話で確認）';
      state.sel.how='保護者に電話して確認';state.screen='S14';break;}
    case 'holdNg':{const c=child(state.childId);const w=document.getElementById('holdWho');
      const who=(w&&w.value)||'来園者（氏名不明）';
      state.records.push({t:now(),child:c.name+c.sfx,to:who,how:'確認できず',ng:true,
        staff:state.role==='clerk'?'渡辺 さくら（事務）':'佐々木 みなみ（ひまわり組）'});
      addPost(state.role==='clerk'?'事務スタッフ':'担任',state.role==='clerk'?'clerk':'teacher',
        `【引き渡し保留】${c.name}${c.sfx}：${who}が来園しましたが、本人確認ができないため引き渡していません。保護者に連絡中です。`);
      state.hold=null;state.screen='S10';toast('引き渡さずに記録しました');break;}
    case 'release':{const c=child(state.childId);c.st='released';
      state.records.push({t:now(),child:c.name+c.sfx,to:state.sel.proxyName||c.by,how:state.sel.how||'保護者本人',
        staff:state.role==='clerk'?'渡辺 さくら（事務）':'佐々木 みなみ（ひまわり組）'});
      addPost(state.role==='clerk'?'事務スタッフ':'担任',state.role==='clerk'?'clerk':'teacher',
        `${c.name}${c.sfx}を${state.sel.proxyName||c.by}へ引き渡しました。（${hm(now())}）`);
      state.screen='S10';toast('降園済みにしました');break;}
    case 'ack':{const p=state.posts.find(x=>x.id===arg);if(p)p.ack=p.ack?0:(p.ack||0)+1;break;}
    case 'quickPost':{const el=document.getElementById('quick');const txt=(el&&el.value||'').trim();
      if(!txt){toast('投稿する内容を入力してください');break;}
      addPost(state.role==='clerk'?'事務スタッフ':'担任',state.role==='clerk'?'clerk':'teacher',txt);toast('全職員に共有しました');break;}
    case 'postMemo':{const txt=document.getElementById('memoTxt').value.trim(),cid=document.getElementById('memoChild').value;
      if(!txt){toast('内容を入力してください');break;}
      addPost(state.role==='clerk'?'事務スタッフ':'担任',state.role==='clerk'?'clerk':'teacher',(cid?`${child(cid).name}${child(cid).sfx}：`:'')+txt);
      state.screen='S15';toast('全職員に共有しました');break;}
    case 'submitAgent':{const cid=state.ag.cid,ty=document.getElementById('agType').value,
        tm=document.getElementById('agTime').value,memo=document.getElementById('agMemo').value,c=child(cid),before=c?c.pickupAt:0;
      if(c&&tm&&(ty==='late'||ty==='early')){const[h,m]=tm.split(':').map(Number);const d=new Date(c.pickupAt);d.setHours(h,m,0,0);
        if(!c.changed)c.planAt=before;c.pickupAt=d.getTime();c.changed='事務スタッフ 代理入力';}
      if(c&&ty==='proxy'){const p=proxiesOf(cid)[0];c.proxy=true;c.by=p.rel+' '+p.name;}
      const label={late:'お迎えが遅くなる',early:'お迎えが早くなる',proxy:'代理人がお迎え',absent:'早退・欠席'}[ty];
      if(!c){toast('園児を選んでください');break;}
      addPost('事務スタッフ','clerk',`【代理入力】${c.name}${c.sfx}：${label}。${(ty==='late'||ty==='early')?`お迎え予定 ${hm(before)} → <b>${hm(c.pickupAt)}</b>。`:''}${memo||''}`);
      state.screen='S15';toast('全職員の端末に反映しました');break;}
    case 'saveThr': state.thr.soon=Math.max(1,+document.getElementById('thrSoon').value||5);
      state.thr.show=Math.max(5,+document.getElementById('thrShow').value||10);toast('色分け条件を保存しました');break;
    case 'ff': state.offset+=arg*60000;toast(arg+'分進めました');break;
    case 'toggleErr': state.err=!state.err;toast(state.err?'送信時に通信エラーを再現します':'通信エラーの再現をやめました');break;
    case 'map': state.modal='map';break;
    case 'accounts': state.modal='acc';break;
    case 'useAcc':{const a=ACCOUNTS.find(x=>x.id===arg);if(!a)break;
      state.modal=null;state.role=a.role;state.loginId=a.id;state.loginPw='';state.loginErr='';
      state.screen=a.role==='parent'?'S02':a.role==='admin'?'S19':'S09';
      toast(a.label+'に切り替えました');break;}
    case 'closeModal': state.modal=null;break;
    case 'reset': reset();toast('初期状態に戻しました');break;
  }
  render();
}
function addPost(who,kind,txt){state.posts.push({id:'m'+Date.now()+Math.random().toString(36).slice(2,5),who,kind,t:now(),txt,ack:0});}

/* =========================================================
   毎秒の更新
   ========================================================= */
function sig(){return state.children.map(c=>c.id+stat(c).k+(c.pickupAt<now()?'p':'f')).join('|');}
function tickLoop(){
  const hn=document.getElementById('hnow');if(hn)hn.textContent=md(now())+'('+wd(now())+') '+hm(now());
  if(state.screen==='S10'||state.screen==='S11'){
    if(sig()!==lastSig){render();return;}
    document.querySelectorAll('[data-arr]').forEach(el=>{
      const c=child(el.dataset.arr);if(!c)return;
      const e=el.querySelector('.js-arr');if(e)e.textContent=elapsedText(c);});
    document.querySelectorAll('[data-cid]').forEach(el=>{
      const c=child(el.dataset.cid);if(!c)return;const t=countText(c);
      const b=el.querySelector('.js-big'),s=el.querySelector('.js-sub');
      if(b)b.textContent=t.big;if(s)s.textContent=t.sub;});
  }
}
setInterval(tickLoop,1000);
render();
</script>
